<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实验室 · 实验功能</title>
  <style>
    /* ===== 样式 ===== */
    * { margin:0; padding:0; box-sizing:border-box; cursor:url('fire.png') 16 16, auto !important; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; padding:1.5rem; margin:0; background:radial-gradient(circle at 50% 50%, var(--bg-start), var(--bg-end)); background-attachment:fixed; transition:background 0.3s; }
    :root { --bg-start:#f0edf7; --bg-end:#ddd8e8; --glass-bg:rgba(255,255,255,0.45); --glass-border:rgba(255,255,255,0.6); --glass-shadow:0 8px 32px rgba(0,0,0,0.08); --glass-blur:blur(12px); --text-primary:#1f1730; --text-secondary:#3f3257; --text-muted:#2f2542; --badge-bg:#3d2b55; --badge-text:#f0ebf7; --shimmer-color:rgba(255,255,255,0.5); --loading-bg:rgba(245,245,250,0.8); --tool-bg:rgba(255,255,255,0.1); }
    .dark-mode { --bg-start:#1b172b; --bg-end:#110f1d; --glass-bg:rgba(30,26,50,0.55); --glass-border:rgba(100,85,140,0.5); --glass-shadow:0 8px 32px rgba(0,0,0,0.5); --text-primary:#e8e0f5; --text-secondary:#c6bcdb; --text-muted:#b0a4c9; --badge-bg:#7a67a8; --badge-text:#f0ebf7; --shimmer-color:rgba(255,255,255,0.08); --loading-bg:rgba(48,48,48,0.8); --tool-bg:rgba(255,255,255,0.05); }
    .loading { position:fixed; display:flex; justify-content:center; align-items:center; top:0; left:0; width:100%; height:100%; z-index:9999; background-color:var(--loading-bg); transition:background-color 0.3s; pointer-events:none; }
    .loading .scale { transform:scale(1.8); }
    .sharingon { position:relative; width:6em; height:6em; background-color:red; border:6px solid black; border-radius:50%; animation:rot 1s ease-in-out infinite; }
    .animated-stop { animation-play-state:paused; }
    .fadeout { animation:fadeOut 1.5s forwards; }
    .scaleAndFadeout { animation:scaleAndFadeOut 1.5s forwards; }
    .ring { position:absolute; content:""; left:50%; top:50%; width:3.5em; height:3.5em; border:4px solid rgba(110,13,13,0.5); border-radius:50%; transform:translate(-50%,-50%); }
    .to,.circle { position:absolute; content:""; border-radius:50%; width:0.9em; height:0.9em; background-color:black; }
    .to:nth-child(1) { top:-0.5em; left:50%; transform:translate(-40%); }
    .to::before { content:""; position:absolute; top:-0.5em; right:-0.2em; width:1.1em; height:0.9em; box-sizing:border-box; border-left:16px solid black; border-radius:100% 0 0; }
    .to:nth-child(2) { bottom:0.5em; left:-0.35em; transform:rotate(-120deg); }
    .to:nth-child(3) { bottom:0.5em; right:-0.35em; transform:rotate(120deg); }
    .circle { top:50%; left:50%; transform:translate(-50%,-50%); box-shadow:0 0 20px 1px; width:1em; height:1em; }
    @keyframes rot { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    @keyframes scaleAndFadeOut { 0%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:1} 100%{transform:scale(1.5);opacity:0} }
    @keyframes fadeOut { 0%{opacity:1} 100%{opacity:0} }
    #particles-canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
    .hub { position:relative; z-index:2; max-width:1200px; width:100%; background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border-radius:3.5rem; padding:2rem 2.8rem; box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,0.2); border:1px solid var(--glass-border); transition:background 0.3s,border 0.3s,box-shadow 0.3s; overflow:hidden; }
    .hub::before { content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:linear-gradient(135deg,transparent 30%,var(--shimmer-color) 50%,transparent 70%); opacity:0.3; pointer-events:none; transform:rotate(25deg); transition:opacity 0.3s; }
    .hub:hover::before { animation:shimmerFlow 2.5s ease-in-out infinite; }
    @keyframes shimmerFlow { 0%{transform:rotate(25deg) translateX(-20%)} 100%{transform:rotate(25deg) translateX(20%)} }
    .navbar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:1.8rem; padding-bottom:0.8rem; border-bottom:2px dashed rgba(255,255,255,0.2); position:relative; z-index:2; }
    .logo h1 { font-size:2rem; font-weight:650; color:var(--text-primary); }
    .logo h1 span { background:var(--badge-bg); color:var(--badge-text); font-size:1.2rem; padding:0.1rem 0.9rem; border-radius:60px; margin-left:0.2rem; }
    .nav-menu { display:flex; gap:0.8rem; list-style:none; flex-wrap:wrap; }
    .nav-menu li a { text-decoration:none; color:var(--text-secondary); padding:0.4rem 1rem; border-radius:40px; background:rgba(255,255,255,0.1); backdrop-filter:blur(4px); transition:0.2s; font-size:0.95rem; }
    .nav-menu li a:hover { background:rgba(255,255,255,0.25); color:var(--text-primary); }
    .nav-actions { display:flex; gap:0.5rem; align-items:center; }
    .theme-toggle { background:rgba(255,255,255,0.15); backdrop-filter:blur(4px); border:1px solid var(--glass-border); font-size:1.8rem; cursor:pointer; padding:0.2rem 0.6rem; border-radius:50px; color:var(--text-primary); line-height:1; }
    .theme-toggle:hover { background:rgba(255,255,255,0.3); }
    .hamburger { display:none; flex-direction:column; gap:5px; background:rgba(255,255,255,0.15); backdrop-filter:blur(4px); border:1px solid var(--glass-border); cursor:pointer; padding:0.4rem 0.5rem; border-radius:12px; }
    .hamburger span { display:block; width:28px; height:3px; background:var(--text-primary); border-radius:6px; transition:all 0.25s; }
    .hamburger.open span:nth-child(1) { transform:translateY(8px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity:0; }
    .hamburger.open span:nth-child(3) { transform:translateY(-8px) rotate(-45deg); }
    .mobile-dropdown { display:none; flex-basis:100%; flex-direction:column; background:var(--glass-bg); backdrop-filter:var(--glass-blur); border-radius:2rem; padding:1.2rem 1.5rem; margin-top:0.8rem; border:1px solid var(--glass-border); }
    .mobile-dropdown.open { display:flex; }
    .mobile-dropdown a { text-decoration:none; color:var(--text-primary); font-size:1.1rem; font-weight:500; padding:0.6rem 0; border-bottom:1px solid rgba(255,255,255,0.1); }
    .mobile-dropdown a:last-child { border-bottom:none; }
    .mobile-dropdown a:hover { color:#a786d0; }
    @media (max-width:768px) { .hub { padding:1.5rem 1.2rem; } .nav-menu { display:none; } .hamburger { display:flex; } .logo h1 { font-size:1.6rem; } }
    @media (min-width:769px) { .mobile-dropdown { display:none!important; } }
    .tools-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1.8rem; margin:1rem 0 2rem; }
    .tool-card { background:var(--tool-bg); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border:1px solid var(--glass-border); border-radius:2rem; padding:1.5rem 1.8rem; transition:all 0.3s ease; }
    .tool-card:hover { background:rgba(255,255,255,0.08); transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,0.06); }
    .dark-mode .tool-card:hover { background:rgba(255,255,255,0.05); }
    .tool-card .tool-title { font-size:1.2rem; font-weight:600; color:var(--text-primary); margin-bottom:0.8rem; display:flex; align-items:center; gap:0.5rem; }
    .tool-card .tool-body { display:flex; flex-direction:column; gap:0.6rem; }
    .tool-card input,.tool-card select { background:rgba(255,255,255,0.08); border:1px solid var(--glass-border); color:var(--text-primary); padding:0.5rem 0.8rem; border-radius:12px; font-size:0.95rem; outline:none; font-family:inherit; transition:0.2s; }
    .tool-card input:focus { border-color:rgba(245,87,108,0.4); background:rgba(255,255,255,0.15); }
    .tool-card .btn { background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%); border:none; color:#fff; padding:0.5rem 1.2rem; border-radius:30px; font-weight:600; cursor:pointer; font-size:0.9rem; transition:all 0.3s ease; box-shadow:0 4px 16px rgba(245,87,108,0.2); }
    .tool-card .btn:hover { transform:scale(1.04); box-shadow:0 6px 24px rgba(245,87,108,0.35); }
    .tool-card .btn-secondary { background:rgba(255,255,255,0.15); box-shadow:none; }
    .tool-card .btn-secondary:hover { background:rgba(255,255,255,0.25); box-shadow:none; }
    .tool-card .result { margin-top:0.4rem; padding:0.5rem 0.8rem; background:rgba(255,255,255,0.05); border-radius:12px; font-size:0.95rem; color:var(--text-secondary); min-height:2.2rem; word-break:break-all; border:1px solid transparent; transition:0.2s; }
    .tool-card .result.highlight { border-color:rgba(245,87,108,0.3); background:rgba(245,87,108,0.05); }
    .ping-log { max-height:120px; overflow-y:auto; font-size:0.85rem; color:var(--text-secondary); background:rgba(0,0,0,0.03); border-radius:10px; padding:0.3rem 0.6rem; border:1px solid var(--glass-border); }
    .ping-log::-webkit-scrollbar { width:4px; }
    .ping-log::-webkit-scrollbar-thumb { background:rgba(245,87,108,0.3); border-radius:4px; }
    .ping-log .log-entry { padding:0.15rem 0; border-bottom:1px solid rgba(255,255,255,0.04); }
    .ping-log .log-entry:last-child { border-bottom:none; }
    .ping-log .ok { color:#4caf50; }
    .ping-log .fail { color:#f44336; }
    .ping-log .warn { color:#ff9800; }
    .ping-status { display:flex; align-items:center; gap:0.5rem; font-weight:500; }
    .ping-status .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#9e9e9e; }
    .ping-status .dot.running { background:#4caf50; animation:pulse-dot 1.2s ease-in-out infinite; }
    .ping-status .dot.stopped { background:#f44336; }
    @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }
    /* ===== 记忆翻牌游戏样式 ===== */
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      margin: 0.5rem 0;
    }
    .memory-card {
      aspect-ratio: 1 / 1;
      background: var(--glass-bg);
      border: 2px solid var(--glass-border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      cursor: pointer;
      transition: all 0.3s ease;
      transform-style: preserve-3d;
      position: relative;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .memory-card .front, .memory-card .back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .memory-card .front {
      background: var(--glass-bg);
      transform: rotateY(180deg);
      font-size: 2.4rem;
    }
    .memory-card .back {
      background: rgba(245,87,108,0.2);
      border: 1px solid var(--glass-border);
      transform: rotateY(0deg);
      font-size: 2rem;
      color: var(--text-secondary);
    }
    .memory-card.flipped {
      transform: rotateY(180deg);
    }
    .memory-card.matched {
      transform: rotateY(180deg);
      border-color: #4caf50;
      box-shadow: 0 0 16px rgba(76,175,80,0.2);
    }
    .memory-card.matched .front {
      background: rgba(76,175,80,0.1);
    }
    .memory-card:active:not(.flipped):not(.matched) {
      transform: scale(0.95);
    }
    .memory-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text-secondary);
      padding: 0.2rem 0;
    }
    .memory-stats span { font-weight: 500; }
    .memory-win {
      text-align: center;
      padding: 0.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #4caf50;
    }
    .external-link { margin-top:0.5rem; text-align:center; }
    .external-link a { color:var(--text-secondary); text-decoration:none; border-bottom:1px dashed rgba(245,87,108,0.3); transition:0.2s; font-size:0.95rem; }
    .external-link a:hover { color:#f5576c; border-bottom-color:#f5576c; }
    .footer-note { margin-top:2.2rem; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; border-top:1px solid var(--glass-border); padding-top:1.5rem; color:var(--text-muted); font-size:0.9rem; transition:color 0.3s; position:relative; z-index:2; }
    .path-hint { background:rgba(255,255,255,0.15); backdrop-filter:blur(4px); padding:0.3rem 1.2rem; border-radius:40px; font-family:'SF Mono','Fira Code',monospace; border:1px solid var(--glass-border); color:var(--text-secondary); font-size:0.8rem; }
    .path-hint code { background:rgba(0,0,0,0.05); padding:0.2rem 0.6rem; border-radius:30px; font-weight:500; color:var(--text-primary); }
    .deploy-badge { display:flex; align-items:center; gap:0.8rem; color:var(--text-muted); }
    .deploy-badge span { background:var(--badge-bg); color:var(--badge-text); padding:0.2rem 1.1rem; border-radius:60px; font-size:0.7rem; font-weight:500; }
    @media (max-width:600px) { .tools-grid { grid-template-columns:1fr; gap:1.2rem; } .footer-note { flex-direction:column; align-items:flex-start; gap:0.6rem; } .path-hint { width:100%; overflow-x:auto; white-space:nowrap; font-size:0.7rem; padding:0.2rem 0.8rem; } .memory-grid { gap:0.4rem; } .memory-card .front { font-size:1.8rem; } .memory-card .back { font-size:1.4rem; } }
    .emoji-burst { position:fixed; pointer-events:none; font-size:2.5rem; z-index:9997; animation:flyOut 1.2s ease-out forwards; user-select:none; }
    @keyframes flyOut { 0%{opacity:1;transform:translate(0,0) scale(0.5) rotate(0deg)} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1.8) rotate(360deg)} }
  </style>
</head>

    <!-- ===== 实验工具 ===== -->

  <script>
    (function() {
      'use strict';

      // ===== 加载动画 =====
      function initLoading() {
        const startTime = Date.now();
        const loading = document.getElementById('loadingOverlay');
        const sharingon = document.getElementById('sharingon');
        document.addEventListener('DOMContentLoaded', function() {
          const elapsed = Date.now() - startTime;
          const delay = elapsed > 1050 ? 0 : 1050 - elapsed;
          setTimeout(() => {
            sharingon.classList.add('animated-stop');
            document.querySelector('.loading .scale').classList.add('scaleAndFadeout');
            loading.classList.add('fadeout');
            setTimeout(() => { loading.style.display = 'none'; }, 1500);
          }, delay);
        });
      }
      initLoading();

      // ===== 粒子背景 =====
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [], mouseX = 0, mouseY = 0, width, height;

      function resizeCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 3 + 1.5;
          this.speedX = (Math.random() - 0.5) * 0.5;
          this.speedY = (Math.random() - 0.5) * 0.5;
          this.opacity = Math.random() * 0.5 + 0.2;
          this.color = `hsla(${Math.random() * 60 + 320}, 70%, 65%, `;
        }
        update() {
          const dx = mouseX - this.x, dy = mouseY - this.y, dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 200) { const force = (200 - dist) / 200 * 0.02; this.x += dx * force; this.y += dy * force; }
          this.x += this.speedX; this.y += this.speedY;
          if (this.x < 0 || this.x > width) this.speedX *= -1;
          if (this.y < 0 || this.y > height) this.speedY *= -1;
        }
        draw() {
          ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color + this.opacity + ')'; ctx.fill();
          if (this.size > 2.5) { ctx.shadowColor = 'rgba(245,87,108,0.15)'; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0; }
        }
      }
      const particleCount = Math.min(120, Math.floor((width * height) / 8000));
      for (let i = 0; i < particleCount; i++) particles.push(new Particle());

      function drawLines() {
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 120) {
              ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(180,140,220,${0.08 * (1 - dist / 120)})`;
              ctx.lineWidth = 0.8; ctx.stroke();
            }
          }
        }
      }
      function animateParticles() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => { p.update(); p.draw(); });
        drawLines();
        requestAnimationFrame(animateParticles);
      }
      animateParticles();

      // ===== 深色模式 =====
      const htmlElement = document.documentElement;
      const themeToggle = document.getElementById('themeToggle');

      function getPreferredTheme() {
        const stored = localStorage.getItem('cavez-theme');
        if (stored === 'dark' || stored === 'light') return stored;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      function setTheme(theme) {
        if (theme === 'dark') { htmlElement.classList.add('dark-mode'); themeToggle.textContent = '☀️'; }
        else { htmlElement.classList.remove('dark-mode'); themeToggle.textContent = '🌙'; }
        localStorage.setItem('cavez-theme', theme);
      }
      setTheme(getPreferredTheme());
      themeToggle.addEventListener('click', function() {
        setTheme(htmlElement.classList.contains('dark-mode') ? 'light' : 'dark');
      });
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (localStorage.getItem('cavez-theme') === null) setTheme(e.matches ? 'dark' : 'light');
      });

      // ===== 汉堡菜单 =====
      const hamburger = document.getElementById('hamburgerBtn');
      const dropdown = document.getElementById('mobileDropdown');
      hamburger.addEventListener('click', function() {
        dropdown.classList.toggle('open');
        hamburger.classList.toggle('open');
      });
      dropdown.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function() {
          dropdown.classList.remove('open');
          hamburger.classList.remove('open');
        });
      });
      window.addEventListener('resize', function() {
        if (window.innerWidth > 768) {
          dropdown.classList.remove('open');
          hamburger.classList.remove('open');
        }
      });

      // ============================================================
      // 已有工具函数（倒计时、颜色、反转、计算器、Ping）
      // ============================================================

      // --- 1. 倒计时器 ---
      let countdownTimer = null;
      const countdownBtn = document.getElementById('countdownBtn');
      const countdownInput = document.getElementById('countdownInput');
      const countdownResult = document.getElementById('countdownResult');

      countdownBtn.addEventListener('click', function() {
        if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
        let seconds = parseInt(countdownInput.value) || 10;
        if (seconds < 1) seconds = 1;
        if (seconds > 600) seconds = 600;
        countdownInput.value = seconds;
        countdownResult.textContent = `⏳ ${seconds} 秒`;
        countdownResult.classList.add('highlight');

        countdownTimer = setInterval(function() {
          seconds--;
          if (seconds <= 0) {
            clearInterval(countdownTimer);
            countdownTimer = null;
            countdownResult.textContent = '🔔 时间到！';
            countdownResult.style.borderColor = '#f5576c';
          } else {
            countdownResult.textContent = `⏳ ${seconds} 秒`;
          }
        }, 1000);
      });

      // --- 2. 随机颜色 ---
      const colorBtn = document.getElementById('colorBtn');
      const colorResult = document.getElementById('colorResult');
      colorBtn.addEventListener('click', function() {
        const r = Math.floor(Math.random() * 256);
        const g = Math.floor(Math.random() * 256);
        const b = Math.floor(Math.random() * 256);
        const hex = '#' + [r, g, b].map(c => c.toString(16).padStart(2, '0')).join('');
        colorResult.textContent = hex;
        colorResult.style.background = hex;
        colorResult.style.color = (r * 0.299 + g * 0.587 + b * 0.114) > 186 ? '#1f1730' : '#f0ece4';
        colorResult.classList.add('highlight');
      });

      // --- 3. 文本反转 ---
      const reverseInput = document.getElementById('reverseInput');
      const reverseBtn = document.getElementById('reverseBtn');
      const reverseResult = document.getElementById('reverseResult');
      reverseBtn.addEventListener('click', function() {
        const text = reverseInput.value || '';
        if (!text) { reverseResult.textContent = '⚠️ 请先输入文字'; return; }
        const reversed = text.split('').reverse().join('');
        reverseResult.textContent = `🔁 ${reversed}`;
        reverseResult.classList.add('highlight');
      });

      // --- 4. 计算器 ---
      const calcNum1 = document.getElementById('calcNum1');
      const calcNum2 = document.getElementById('calcNum2');
      const calcOp = document.getElementById('calcOp');
      const calcBtn = document.getElementById('calcBtn');
      const calcResult = document.getElementById('calcResult');
      calcBtn.addEventListener('click', function() {
        const num1 = parseFloat(calcNum1.value);
        const num2 = parseFloat(calcNum2.value);
        if (isNaN(num1) || isNaN(num2)) {
          calcResult.textContent = '⚠️ 请输入有效数字';
          return;
        }
        const op = calcOp.value;
        let result;
        switch (op) {
          case '+': result = num1 + num2; break;
          case '-': result = num1 - num2; break;
          case '*': result = num1 * num2; break;
          case '/': result = num2 !== 0 ? num1 / num2 : '❌ 除数不能为0'; break;
          default: result = '?';
        }
        calcResult.textContent = `= ${result}`;
        calcResult.classList.add('highlight');
      });

      // --- 5. Ping GitHub ---
      const pingDot = document.getElementById('pingDot');
      const pingStatusText = document.getElementById('pingStatusText');
      const pingStartBtn = document.getElementById('pingStartBtn');
      const pingStopBtn = document.getElementById('pingStopBtn');
      const pingClearBtn = document.getElementById('pingClearBtn');
      const pingLatest = document.getElementById('pingLatest');
      const pingLog = document.getElementById('pingLog');
      let pingInterval = null, pingRunning = false;
      const logEntries = [];

      function addLogEntry(entry) {
        logEntries.push(entry);
        if (logEntries.length > 10) logEntries.shift();
        renderLog();
        let statusText = '';
        if (entry.ok === true) statusText = `✅ 成功 (${entry.time}ms)`;
        else if (entry.ok === false && entry.error === 'timeout') statusText = '⏱️ 超时';
        else if (entry.ok === false && entry.error === 'network') statusText = '🌐 网络错误';
        else if (entry.ok === false && entry.error === 'cors') statusText = '🚫 跨域限制';
        else if (entry.ok === false) statusText = '❌ 失败';
        else statusText = '⏳ 未知状态';
        pingLatest.textContent = `🕒 ${entry.timestamp} ${statusText}`;
        pingLatest.classList.add('highlight');
      }

      function renderLog() {
        pingLog.innerHTML = logEntries.map(entry => {
          let cls = 'fail', status = '❌', extra = '';
          if (entry.ok === true) { cls = 'ok'; status = '✅'; extra = ` ${entry.time}ms`; }
          else if (entry.error === 'timeout') { cls = 'warn'; status = '⏱️'; extra = ' 超时'; }
          else if (entry.error === 'cors') { cls = 'warn'; status = '🚫'; extra = ' 跨域限制'; }
          else if (entry.error === 'network') { cls = 'fail'; status = '🌐'; extra = ' 网络错误'; }
          else { cls = 'fail'; status = '❌'; extra = ' 失败'; }
          return `<div class="log-entry ${cls}">${entry.timestamp} ${status}${extra}</div>`;
        }).join('');
        pingLog.scrollTop = pingLog.scrollHeight;
      }

      function doPing() {
        const start = performance.now();
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);
        fetch('https://github.com', { mode: 'cors', signal: controller.signal })
          .then(response => {
            clearTimeout(timeoutId);
            const end = performance.now();
            const elapsed = Math.round(end - start);
            const now = new Date();
            const timestamp = now.toLocaleTimeString('zh-CN');
            addLogEntry({ ok: response.ok, time: elapsed, timestamp });
            pingDot.className = 'dot running';
            pingStatusText.textContent = '正在监控';
          })
          .catch(err => {
            clearTimeout(timeoutId);
            const end = performance.now();
            const elapsed = Math.round(end - start);
            const now = new Date();
            const timestamp = now.toLocaleTimeString('zh-CN');
            let errorType = 'network';
            if (err.name === 'AbortError') errorType = 'timeout';
            else if (err.message && err.message.includes('CORS')) errorType = 'cors';
            else if (err.message && err.message.includes('Failed to fetch')) errorType = 'network';
            addLogEntry({ ok: false, time: elapsed, timestamp, error: errorType });
            pingDot.className = 'dot running';
            pingStatusText.textContent = '正在监控';
          });
      }

      function startPing() {
        if (pingRunning) return;
        pingRunning = true;
        pingDot.className = 'dot running';
        pingStatusText.textContent = '正在监控';
        doPing();
        pingInterval = setInterval(doPing, 10000);
        pingStartBtn.textContent = '▶️ 运行中';
        pingStartBtn.disabled = true;
        pingStopBtn.disabled = false;
      }
      function stopPing() {
        if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
        pingRunning = false;
        pingDot.className = 'dot stopped';
        pingStatusText.textContent = '已停止';
        pingStartBtn.textContent = '▶️ 开始监控';
        pingStartBtn.disabled = false;
        pingStopBtn.disabled = true;
      }
      function clearLog() {
        logEntries.length = 0;
        renderLog();
        pingLatest.textContent = '记录已清空';
        pingLatest.classList.remove('highlight');
      }
      pingStartBtn.addEventListener('click', startPing);
      pingStopBtn.addEventListener('click', stopPing);
      pingClearBtn.addEventListener('click', clearLog);
      pingStopBtn.disabled = true;

      // ============================================================
      // 6. 记忆翻牌游戏
      // ============================================================
      const memoryGrid = document.getElementById('memoryGrid');
      const memoryMoves = document.getElementById('memoryMoves');
      const memoryPairs = document.getElementById('memoryPairs');
      const memoryMessage = document.getElementById('memoryMessage');
      const memoryReset = document.getElementById('memoryReset');

      const EMOJIS = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼']; // 8对
      let cards = [];
      let flippedCards = [];
      let matchedPairs = 0;
      let moves = 0;
      let lockBoard = false;

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      function initGame() {
        const deck = [...EMOJIS, ...EMOJIS];
        shuffle(deck);
        cards = deck.map((emoji, index) => ({
          id: index,
          emoji: emoji,
          flipped: false,
          matched: false
        }));
        flippedCards = [];
        matchedPairs = 0;
        moves = 0;
        lockBoard = false;
        memoryMoves.textContent = '0';
        memoryPairs.textContent = '0';
        memoryMessage.textContent = '';
        renderGrid();
      }

      function renderGrid() {
        memoryGrid.innerHTML = '';
        cards.forEach((card, index) => {
          const cardEl = document.createElement('div');
          cardEl.className = 'memory-card';
          if (card.flipped || card.matched) cardEl.classList.add('flipped');
          if (card.matched) cardEl.classList.add('matched');

          const front = document.createElement('div');
          front.className = 'front';
          front.textContent = card.emoji;

          const back = document.createElement('div');
          back.className = 'back';
          back.textContent = '?';

          cardEl.appendChild(front);
          cardEl.appendChild(back);

          cardEl.dataset.index = index;
          cardEl.addEventListener('click', () => onCardClick(index));
          memoryGrid.appendChild(cardEl);
        });
      }

      function onCardClick(index) {
        if (lockBoard) return;
        const card = cards[index];
        if (card.flipped || card.matched) return;
        if (flippedCards.length >= 2) return;

        // 翻牌
        card.flipped = true;
        flippedCards.push(index);
        renderGrid();

        if (flippedCards.length === 2) {
          moves++;
          memoryMoves.textContent = moves;
          const idx1 = flippedCards[0];
          const idx2 = flippedCards[1];
          const card1 = cards[idx1];
          const card2 = cards[idx2];

          if (card1.emoji === card2.emoji) {
            // 匹配成功
            card1.matched = true;
            card2.matched = true;
            matchedPairs++;
            memoryPairs.textContent = matchedPairs;
            flippedCards = [];
            renderGrid();
            if (matchedPairs === EMOJIS.length) {
              memoryMessage.textContent = '🎉 恭喜完成！步数: ' + moves;
            }
          } else {
            // 不匹配，锁定后翻回
            lockBoard = true;
            setTimeout(() => {
              card1.flipped = false;
              card2.flipped = false;
              flippedCards = [];
              lockBoard = false;
              renderGrid();
            }, 600);
          }
        }
      }

      memoryReset.addEventListener('click', initGame);
      initGame();

      // ===== 点击弹出表情包 =====
      const emojiList = ['🎉', '✨', '🌟', '💫', '😊', '🥳', '🎈', '🎁', '💖', '🌈', '🔥', '⭐', '🦄', '🍀', '🎶', '💥', '🤩', '😍', '👻', '🐱', '🌸'];
      function createEmojiBurst(e) {
        const emoji = emojiList[Math.floor(Math.random() * emojiList.length)];
        const el = document.createElement('div');
        el.className = 'emoji-burst';
        el.textContent = emoji;
        el.style.left = e.clientX + 'px';
        el.style.top = e.clientY + 'px';
        const angle = Math.random() * 2 * Math.PI;
        const distance = 80 + Math.random() * 150;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance - 80;
        el.style.setProperty('--tx', tx + 'px');
        el.style.setProperty('--ty', ty + 'px');
        const size = 1.8 + Math.random() * 2.2;
        el.style.fontSize = size + 'rem';
        document.body.appendChild(el);
        el.addEventListener('animationend', function() { el.remove(); });
      }
      document.addEventListener('click', createEmojiBurst);

      // ================================================================
      // 🔊 每次点击都播放 anvil.ogg
      // ================================================================

      const audio = document.getElementById('bgAudio');

      document.addEventListener('click', function() {
        audio.currentTime = 0;
        audio.play().catch(function(err) {
          console.log('音频播放被阻止:', err);
        });
      });

      console.log('🧪 lab.html · 已更换 fire.png 光标 + 每次点击播放 anvil.ogg');
    })();
  </script>
</body>
