<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYW · 图片集</title>
  <style>
    /* ===== 复用主站样式（精简版，保持一致性） ===== */
    :root {
      --bg-start: #f0edf7;
      --bg-end: #ddd8e8;
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(255, 255, 255, 0.6);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      --glass-blur: blur(12px);
      --text-primary: #1f1730;
      --text-secondary: #3f3257;
      --text-muted: #2f2542;
      --badge-bg: #3d2b55;
      --badge-text: #f0ebf7;
      --shimmer-color: rgba(255, 255, 255, 0.5);
      --cursor-color: rgba(245, 87, 108, 0.85);
      --cursor-hover: rgba(168, 85, 247, 0.7);
      --loading-bg: rgba(245, 245, 250, 0.8);
    }
    .dark-mode {
      --bg-start: #1b172b;
      --bg-end: #110f1d;
      --glass-bg: rgba(30, 26, 50, 0.55);
      --glass-border: rgba(100, 85, 140, 0.5);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      --text-primary: #e8e0f5;
      --text-secondary: #c6bcdb;
      --text-muted: #b0a4c9;
      --badge-bg: #7a67a8;
      --badge-text: #f0ebf7;
      --shimmer-color: rgba(255, 255, 255, 0.08);
      --cursor-color: rgba(245, 87, 108, 0.85);
      --cursor-hover: rgba(168, 85, 247, 0.7);
      --loading-bg: rgba(48, 48, 48, 0.8);
    }
    * { margin:0; padding:0; box-sizing:border-box; cursor:none !important; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      padding: 1.5rem;
      margin:0;
      background: radial-gradient(circle at 50% 50%, var(--bg-start), var(--bg-end));
      background-attachment: fixed;
      transition: background 0.3s;
    }

    /* 加载动画（与主站相同，略去重复代码，这里简写，但为了完整我们包含） */
    .loading {
      position: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background-color: var(--loading-bg);
      transition: background-color 0.3s;
      pointer-events: none;
    }
    .loading .scale { transform: scale(1.8); }
    .sharingon {
      position: relative;
      width: 6em;
      height: 6em;
      background-color: red;
      border: 6px solid black;
      border-radius: 50%;
      animation: rot 1s ease-in-out infinite;
    }
    .animated-stop { animation-play-state: paused; }
    .fadeout { animation: fadeOut 1.5s forwards; }
    .scaleAndFadeout { animation: scaleAndFadeOut 1.5s forwards; }
    .ring {
      position: absolute;
      content: "";
      left: 50%;
      top: 50%;
      width: 3.5em;
      height: 3.5em;
      border: 4px solid rgba(110, 13, 13, 0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .to, .circle {
      position: absolute;
      content: "";
      border-radius: 50%;
      width: 0.9em;
      height: 0.9em;
      background-color: black;
    }
    .to:nth-child(1) { top: -0.5em; left: 50%; transform: translate(-40%); }
    .to::before {
      content: "";
      position: absolute;
      top: -0.5em;
      right: -0.2em;
      width: 1.1em;
      height: 0.9em;
      box-sizing: border-box;
      border-left: 16px solid black;
      border-radius: 100% 0 0;
    }
    .to:nth-child(2) { bottom: 0.5em; left: -0.35em; transform: rotate(-120deg); }
    .to:nth-child(3) { bottom: 0.5em; right: -0.35em; transform: rotate(120deg); }
    .circle {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 20px 1px;
      width: 1em;
      height: 1em;
    }
    @keyframes rot {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes scaleAndFadeOut {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    @keyframes fadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    .custom-cursor {
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--cursor-color);
      box-shadow: 0 0 20px rgba(245, 87, 108, 0.4), 0 0 60px rgba(245, 87, 108, 0.15);
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, background 0.2s;
      will-change: transform;
      mix-blend-mode: difference;
    }
    .custom-cursor.hover {
      width: 36px;
      height: 36px;
      background: var(--cursor-hover);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
    }

    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .hub {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      width: 100%;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: 3.5rem;
      padding: 2rem 2.8rem;
      box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.2);
      border: 1px solid var(--glass-border);
      transition: background 0.3s, border 0.3s, box-shadow 0.3s;
      overflow: hidden;
    }
    .hub::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(135deg, transparent 30%, var(--shimmer-color) 50%, transparent 70%);
      opacity: 0.3;
      pointer-events: none;
      transform: rotate(25deg);
      transition: opacity 0.3s;
    }
    .hub:hover::before {
      animation: shimmerFlow 2.5s ease-in-out infinite;
    }
    @keyframes shimmerFlow {
      0% { transform: rotate(25deg) translateX(-20%); }
      100% { transform: rotate(25deg) translateX(20%); }
    }

    /* 导航栏（简版，仅返回首页） */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 1.8rem;
      padding-bottom: 0.8rem;
      border-bottom: 2px dashed rgba(255,255,255,0.2);
    }
    .logo h1 {
      font-size: 2rem;
      font-weight: 650;
      color: var(--text-primary);
    }
    .logo h1 span {
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 0.1rem 0.9rem;
      border-radius: 60px;
      font-size: 1.2rem;
      margin-left: 0.2rem;
    }
    .nav-menu {
      display: flex;
      gap: 1rem;
      list-style: none;
    }
    .nav-menu li a {
      text-decoration: none;
      color: var(--text-secondary);
      padding: 0.4rem 1rem;
      border-radius: 40px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(4px);
      transition: 0.2s;
    }
    .nav-menu li a:hover {
      background: rgba(255,255,255,0.25);
      color: var(--text-primary);
    }

    /* 图片网格 */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1.2rem;
      margin-top: 1.5rem;
    }
    .image-grid a {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(4px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1rem 0.5rem;
      text-align: center;
      text-decoration: none;
      color: var(--text-primary);
      transition: all 0.3s;
      font-weight: 500;
      font-size: 0.95rem;
    }
    .image-grid a:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      border-color: rgba(245,87,108,0.3);
    }
    .image-grid a .num {
      display: block;
      font-size: 0.8rem;
      opacity: 0.6;
      margin-top: 0.2rem;
    }

    .footer-note {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--glass-border);
      color: var(--text-muted);
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .emoji-burst {
      position: fixed;
      pointer-events: none;
      font-size: 2.5rem;
      z-index: 9997;
      animation: flyOut 1.2s ease-out forwards;
      user-select: none;
    }
    @keyframes flyOut {
      0% { opacity:1; transform: translate(0,0) scale(0.5) rotate(0deg); }
      100% { opacity:0; transform: translate(var(--tx), var(--ty)) scale(1.8) rotate(360deg); }
    }

    @media (max-width: 600px) {
      .hub { padding: 1.2rem; }
      .image-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- ===== 加载动画 ===== -->
  <div class="loading" id="loadingOverlay">
    <div class="scale">
      <div class="sharingon" id="sharingon">
        <div class="ring"><div class="to"></div><div class="to"></div><div class="to"></div><div class="circle"></div></div>
      </div>
    </div>
  </div>

  <!-- ===== 自定义光标 ===== -->
  <div class="custom-cursor" id="customCursor"></div>

  <!-- ===== 粒子背景 Canvas ===== -->
  <canvas id="particles-canvas"></canvas>

  <!-- ===== 主容器 ===== -->
  <div class="hub">
    <!-- 导航栏（返回首页） -->
    <nav class="navbar">
      <div class="logo">
        <h1>🖼️ HYW <span>图片集</span></h1>
      </div>
      <ul class="nav-menu">
        <li><a href="index.html">🏠 返回首页</a></li>
      </ul>
    </nav>

    <!-- 30个图片链接，由JS生成 -->
    <div class="image-grid" id="imageGrid"></div>

    <div class="footer-note">
      <span>共 30 张图片 · hyw01.jpg ~ hyw30.jpg</span>
      <span>点击即可打开</span>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ===== 加载动画 =====
      function initLoading() {
        const startTime = Date.now();
        const loading = document.getElementById('loadingOverlay');
        const sharingon = document.getElementById('sharingon');
        document.addEventListener('DOMContentLoaded', function() {
          const elapsed = Date.now() - startTime;
          const delay = elapsed > 1050 ? 0 : 1050 - elapsed;
          setTimeout(() => {
            sharingon.classList.add('animated-stop');
            document.querySelector('.loading .scale').classList.add('scaleAndFadeout');
            loading.classList.add('fadeout');
            setTimeout(() => { loading.style.display = 'none'; }, 1500);
          }, delay);
        });
      }
      initLoading();

      // ===== 自定义光标 =====
      const cursor = document.getElementById('customCursor');
      document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });
      document.addEventListener('mouseenter', () => cursor.style.opacity = '1');
      document.addEventListener('mouseleave', () => cursor.style.opacity = '0');
      document.querySelectorAll('a, button').forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
        el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
      });

      // ===== 粒子背景 =====
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [], mouseX = 0, mouseY = 0, width, height;
      function resizeCanvas() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 3 + 1.5;
          this.speedX = (Math.random() - 0.5) * 0.5;
          this.speedY = (Math.random() - 0.5) * 0.5;
          this.opacity = Math.random() * 0.5 + 0.2;
          this.color = `hsla(${Math.random() * 60 + 320}, 70%, 65%, `;
        }
        update() {
          const dx = mouseX - this.x, dy = mouseY - this.y, dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 200) { const force = (200 - dist) / 200 * 0.02; this.x += dx * force; this.y += dy * force; }
          this.x += this.speedX; this.y += this.speedY;
          if (this.x < 0 || this.x > width) this.speedX *= -1;
          if (this.y < 0 || this.y > height) this.speedY *= -1;
        }
        draw() {
          ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color + this.opacity + ')'; ctx.fill();
          if (this.size > 2.5) { ctx.shadowColor = 'rgba(245,87,108,0.15)'; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0; }
        }
      }
      const particleCount = Math.min(120, Math.floor((width * height) / 8000));
      for (let i = 0; i < particleCount; i++) particles.push(new Particle());
      function drawLines() {
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 120) {
              ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(180,140,220,${0.08 * (1 - dist / 120)})`;
              ctx.lineWidth = 0.8; ctx.stroke();
            }
          }
        }
      }
      function animateParticles() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => { p.update(); p.draw(); });
        drawLines();
        requestAnimationFrame(animateParticles);
      }
      animateParticles();

      // ===== 深色模式（同步主站设置） =====
      const htmlElement = document.documentElement;
      function getPreferredTheme() {
        const stored = localStorage.getItem('cavez-theme');
        if (stored === 'dark' || stored === 'light') return stored;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      function setTheme(theme) {
        if (theme === 'dark') htmlElement.classList.add('dark-mode');
        else htmlElement.classList.remove('dark-mode');
        localStorage.setItem('cavez-theme', theme);
      }
      setTheme(getPreferredTheme());
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (localStorage.getItem('cavez-theme') === null) setTheme(e.matches ? 'dark' : 'light');
      });

      // ===== 生成30个链接 =====
      const grid = document.getElementById('imageGrid');
      for (let i = 1; i <= 30; i++) {
        const num = String(i).padStart(2, '0');
        const link = document.createElement('a');
        link.href = `hyw${num}.jpg`;
        link.target = '_blank';
        link.innerHTML = `🖼️ hyw${num} <span class="num">点击打开</span>`;
        grid.appendChild(link);
      }

      // ===== 表情包点击 =====
      const emojiList = ['🎉', '✨', '🌟', '💫', '😊', '🥳', '🎈', '🎁', '💖', '🌈', '🔥', '⭐', '🦄', '🍀', '🎶', '💥', '🤩', '😍', '👻', '🐱', '🌸'];
      function createEmojiBurst(e) {
        const emoji = emojiList[Math.floor(Math.random() * emojiList.length)];
        const el = document.createElement('div');
        el.className = 'emoji-burst';
        el.textContent = emoji;
        el.style.left = e.clientX + 'px';
        el.style.top = e.clientY + 'px';
        const angle = Math.random() * 2 * Math.PI;
        const distance = 80 + Math.random() * 150;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance - 80;
        el.style.setProperty('--tx', tx + 'px');
        el.style.setProperty('--ty', ty + 'px');
        const size = 1.8 + Math.random() * 2.2;
        el.style.fontSize = size + 'rem';
        document.body.appendChild(el);
        el.addEventListener('animationend', function() { el.remove(); });
      }
      document.addEventListener('click', createEmojiBurst);

      console.log('✅ HYW 页面已加载，共30个图片链接');
    })();
  </script>
</body>
</html>
