<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAVEZ · 动态玻璃分站</title>
  <style>
    /* ===== 所有样式与之前完全一致，此处省略以节省篇幅 ===== */
    /* 实际使用时请复制上一条回答中的完整样式，或告诉我需要单独提供 */
    /* 下面是新增的“启用对话”按钮样式 */
    .chat-popup .header .enable-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: 0.2s;
      margin-right: 0.3rem;
    }
    .chat-popup .header .enable-btn:hover {
      background: rgba(255,255,255,0.2);
      color: var(--text-primary);
    }
    .chat-popup .header .enable-btn.active {
      background: rgba(76, 175, 80, 0.2);
      border-color: #4caf50;
      color: #4caf50;
    }
  </style>
</head>
<body>

  <!-- ===== 加载动画 ===== -->
  <div class="loading" id="loadingOverlay">
    <div class="scale">
      <div class="sharingon" id="sharingon">
        <div class="ring"><div class="to"></div><div class="to"></div><div class="to"></div><div class="circle"></div></div>
      </div>
    </div>
  </div>

  <!-- ===== 自定义光标 ===== -->
  <div class="custom-cursor" id="customCursor"></div>

  <!-- ===== 粒子背景 Canvas ===== -->
  <canvas id="particles-canvas"></canvas>

  <!-- ===== 主容器 ===== -->
  <div class="hub" id="hubContainer">
    <!-- 导航栏、卡片网格、MC公告、图片展示等与之前完全一致，此处省略 -->
    <!-- 实际使用时请粘贴完整的导航和网格内容 -->
  </div>

  <!-- ===== 🐋 小鲸鱼按钮 ===== -->
  <div class="whale-btn" id="whaleBtn" title="戳我和 AI 聊天～">
    <img src="https://fe-static.deepseek.com/chat/static/web-error-logo-light.89842be665.png" alt="🐋">
  </div>

  <!-- ===== 对话小窗（安全版） ===== -->
  <div class="chat-popup" id="chatPopup">
    <div class="header">
      <div class="title" id="dragHandle">
        <img src="https://fe-static.deepseek.com/chat/static/web-error-logo-light.89842be665.png" alt="🐋">
        AI · 小窗
      </div>
      <div>
        <button class="enable-btn" id="enableChatBtn">🔒 启用对话</button>
        <button class="clear-btn" id="clearChatBtn" title="清空对话">🗑️</button>
        <button class="close-btn" id="closePopup">✕</button>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="message assistant">🐋 嗨！点击「启用对话」后即可开始聊天～</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="输入消息..." autofocus disabled>
      <button class="send-btn" id="sendBtn" disabled>发送</button>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ===== 加载动画 =====
      function initLoading() {
        const startTime = Date.now();
        const loading = document.getElementById('loadingOverlay');
        const sharingon = document.getElementById('sharingon');
        document.addEventListener('DOMContentLoaded', function() {
          const elapsed = Date.now() - startTime;
          const delay = elapsed > 1050 ? 0 : 1050 - elapsed;
          setTimeout(() => {
            sharingon.classList.add('animated-stop');
            document.querySelector('.loading .scale').classList.add('scaleAndFadeout');
            loading.classList.add('fadeout');
            setTimeout(() => { loading.style.display = 'none'; }, 1500);
          }, delay);
        });
      }
      initLoading();

      // ===== 自定义光标 =====
      const cursor = document.getElementById('customCursor');
      document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });
      document.addEventListener('mouseenter', () => cursor.style.opacity = '1');
      document.addEventListener('mouseleave', () => cursor.style.opacity = '0');
      document.querySelectorAll('a, button, input, .card, .theme-toggle, .hamburger, .mc-copy, .whale-btn, .close-btn, .send-btn, .clear-btn, .enable-btn').forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
        el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
      });

      // ===== 粒子背景 =====
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [], mouseX = 0, mouseY = 0, width, height;

      function resizeCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 3 + 1.5;
          this.speedX = (Math.random() - 0.5) * 0.5;
          this.speedY = (Math.random() - 0.5) * 0.5;
          this.opacity = Math.random() * 0.5 + 0.2;
          this.color = `hsla(${Math.random() * 60 + 320}, 70%, 65%, `;
        }
        update() {
          const dx = mouseX - this.x, dy = mouseY - this.y, dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 200) { const force = (200 - dist) / 200 * 0.02; this.x += dx * force; this.y += dy * force; }
          this.x += this.speedX; this.y += this.speedY;
          if (this.x < 0 || this.x > width) this.speedX *= -1;
          if (this.y < 0 || this.y > height) this.speedY *= -1;
        }
        draw() {
          ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color + this.opacity + ')'; ctx.fill();
          if (this.size > 2.5) { ctx.shadowColor = 'rgba(245,87,108,0.15)'; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0; }
        }
      }
      const particleCount = Math.min(120, Math.floor((width * height) / 8000));
      for (let i = 0; i < particleCount; i++) particles.push(new Particle());

      function drawLines() {
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 120) {
              ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(180,140,220,${0.08 * (1 - dist / 120)})`;
              ctx.lineWidth = 0.8; ctx.stroke();
            }
          }
        }
      }
      function animateParticles() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => { p.update(); p.draw(); });
        drawLines();
        requestAnimationFrame(animateParticles);
      }
      animateParticles();

      // ===== 深色模式 =====
      const themeToggle = document.getElementById('themeToggle');
      const htmlElement = document.documentElement;

      function getPreferredTheme() {
        const stored = localStorage.getItem('cavez-theme');
        if (stored === 'dark' || stored === 'light') return stored;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      function setTheme(theme) {
        if (theme === 'dark') { htmlElement.classList.add('dark-mode'); themeToggle.textContent = '☀️'; }
        else { htmlElement.classList.remove('dark-mode'); themeToggle.textContent = '🌙'; }
        localStorage.setItem('cavez-theme', theme);
      }
      setTheme(getPreferredTheme());
      themeToggle.addEventListener('click', function() {
        setTheme(htmlElement.classList.contains('dark-mode') ? 'light' : 'dark');
      });
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (localStorage.getItem('cavez-theme') === null) setTheme(e.matches ? 'dark' : 'light');
      });

      // ===== 汉堡菜单 =====
      const hamburger = document.getElementById('hamburgerBtn');
      const dropdown = document.getElementById('mobileDropdown');
      hamburger.addEventListener('click', function() {
        dropdown.classList.toggle('open');
        hamburger.classList.toggle('open');
      });
      dropdown.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function() {
          dropdown.classList.remove('open');
          hamburger.classList.remove('open');
        });
      });
      window.addEventListener('resize', function() {
        if (window.innerWidth > 768) {
          dropdown.classList.remove('open');
          hamburger.classList.remove('open');
        }
      });

      // ===== 复制 IP =====
      const copyBtn = document.getElementById('copyIpBtn');
      const ipDisplay = document.getElementById('mcIpDisplay');
      copyBtn.addEventListener('click', function() {
        const ip = ipDisplay.textContent.trim();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(ip).then(() => {
            const original = copyBtn.textContent;
            copyBtn.textContent = '✅ 已复制';
            setTimeout(() => { copyBtn.textContent = original; }, 2000);
          }).catch(() => { fallbackCopy(ip); });
        } else { fallbackCopy(ip); }
      });
      function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try { document.execCommand('copy'); const original = copyBtn.textContent; copyBtn.textContent = '✅ 已复制'; setTimeout(() => { copyBtn.textContent = original; }, 2000); } catch (e) { alert('复制失败，请手动复制：' + text); }
        document.body.removeChild(textarea);
      }

      // ===== 点击弹出表情包 =====
      const emojiList = ['🎉', '✨', '🌟', '💫', '😊', '🥳', '🎈', '🎁', '💖', '🌈', '🔥', '⭐', '🦄', '🍀', '🎶', '💥', '🤩', '😍', '👻', '🐱', '🌸'];
      function createEmojiBurst(e) {
        const emoji = emojiList[Math.floor(Math.random() * emojiList.length)];
        const el = document.createElement('div');
        el.className = 'emoji-burst';
        el.textContent = emoji;
        el.style.left = e.clientX + 'px';
        el.style.top = e.clientY + 'px';
        const angle = Math.random() * 2 * Math.PI;
        const distance = 80 + Math.random() * 150;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance - 80;
        el.style.setProperty('--tx', tx + 'px');
        el.style.setProperty('--ty', ty + 'px');
        const size = 1.8 + Math.random() * 2.2;
        el.style.fontSize = size + 'rem';
        document.body.appendChild(el);
        el.addEventListener('animationend', function() { el.remove(); });
      }
      document.addEventListener('click', createEmojiBurst);

      // ================================================================
      // 🐋 安全版对话小窗
      // ================================================================

      const whaleBtn = document.getElementById('whaleBtn');
      const popup = document.getElementById('chatPopup');
      const closeBtn = document.getElementById('closePopup');
      const clearBtn = document.getElementById('clearChatBtn');
      const enableBtn = document.getElementById('enableChatBtn');
      const messagesEl = document.getElementById('chatMessages');
      const inputEl = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');

      // -------- 对话已暂时禁用，需要手动启用 --------
      let chatEnabled = false;
      let isLoading = false;
      let lastMessageTime = 0;

      // ---- 检查 URL 参数是否带 admin=1（管理员自动启用） ----
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('admin') === '1') {
        chatEnabled = true;
        enableBtn.textContent = '✅ 已启用';
        enableBtn.classList.add('active');
        inputEl.disabled = false;
        sendBtn.disabled = false;
        addMessage('assistant', '🔓 管理员模式已自动启用，可以开始聊天了。');
      }

      // ---- 启用/禁用对话 ----
      enableBtn.addEventListener('click', function() {
        chatEnabled = !chatEnabled;
        if (chatEnabled) {
          enableBtn.textContent = '✅ 已启用';
          enableBtn.classList.add('active');
          inputEl.disabled = false;
          sendBtn.disabled = false;
          addMessage('assistant', '🔓 对话已启用，你可以开始聊天了！');
          inputEl.focus();
        } else {
          enableBtn.textContent = '🔒 启用对话';
          enableBtn.classList.remove('active');
          inputEl.disabled = true;
          sendBtn.disabled = true;
          addMessage('assistant', '🔒 对话已禁用，点击「启用对话」重新开启。');
        }
      });

      // ---- 打开/关闭小窗 ----
      whaleBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        popup.classList.toggle('open');
        if (popup.classList.contains('open') && chatEnabled) {
          inputEl.focus();
        }
      });
      closeBtn.addEventListener('click', function() { popup.classList.remove('open'); });
      document.addEventListener('click', function(e) {
        if (popup.classList.contains('open')) {
          if (!popup.contains(e.target) && e.target !== whaleBtn && !whaleBtn.contains(e.target)) {
            popup.classList.remove('open');
          }
        }
      });

      // ---- 清空对话 ----
      clearBtn.addEventListener('click', function() {
        while (messagesEl.firstChild) {
          messagesEl.removeChild(messagesEl.firstChild);
        }
        const welcomeMsg = document.createElement('div');
        welcomeMsg.className = 'message assistant';
        welcomeMsg.textContent = chatEnabled ? '🐋 对话已清空，继续聊吧！' : '🐋 对话已清空，点击「启用对话」开始聊天～';
        messagesEl.appendChild(welcomeMsg);
        isLoading = false;
        inputEl.disabled = !chatEnabled;
        sendBtn.disabled = !chatEnabled;
        inputEl.focus();
      });

      // ---- 拖拽 ----
      const dragHandle = document.getElementById('dragHandle');
      let isDragging = false, offsetX = 0, offsetY = 0;
      dragHandle.addEventListener('mousedown', function(e) {
        if (e.target.closest('.close-btn') || e.target.closest('.clear-btn') || e.target.closest('.enable-btn')) return;
        isDragging = true;
        const rect = popup.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        popup.style.cursor = 'grabbing';
        e.preventDefault();
      });
      document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        let left = e.clientX - offsetX, top = e.clientY - offsetY;
        const maxX = window.innerWidth - 420, maxY = window.innerHeight - 560;
        left = Math.max(10, Math.min(left, maxX - 10));
        top = Math.max(10, Math.min(top, maxY - 10));
        popup.style.left = left + 'px';
        popup.style.top = top + 'px';
        popup.style.right = 'auto';
        popup.style.bottom = 'auto';
      });
      document.addEventListener('mouseup', function() {
        if (isDragging) { isDragging = false; popup.style.cursor = ''; }
      });

      // ---- 对话逻辑 ----
      function addMessage(role, content) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = content;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
      }

      function getHistory() {
        const msgs = [];
        const items = messagesEl.querySelectorAll('.message');
        items.forEach(el => {
          const role = el.classList.contains('user') ? 'user' : 'assistant';
          const content = el.textContent;
          if (content === '...' || content === '…') return;
          msgs.push({ role, content });
        });
        return msgs;
      }

      async function sendMessage() {
        // ---- 安全检查 ----
        if (!chatEnabled) {
          addMessage('assistant', '🔒 对话未启用，请先点击「启用对话」按钮。');
          return;
        }
        const text = inputEl.value.trim();
        if (!text || isLoading) return;

        // ---- 防刷：5秒冷却 ----
        const now = Date.now();
        if (now - lastMessageTime < 5000) {
          const waitTime = Math.ceil((5000 - (now - lastMessageTime)) / 1000);
          addMessage('assistant', `⏳ 请稍候 ${waitTime} 秒后再发送。`);
          return;
        }

        inputEl.value = '';
        inputEl.disabled = true;
        sendBtn.disabled = true;
        lastMessageTime = now;

        addMessage('user', text);

        const loadingEl = document.createElement('div');
        loadingEl.className = 'message assistant';
        loadingEl.textContent = '...';
        loadingEl.style.opacity = '0.6';
        messagesEl.appendChild(loadingEl);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        try {
          const history = getHistory();
          const recent = history.slice(-10);

          // ---- 暂时禁用真实 API 调用，防止意外消耗 ----
          // 直接返回提示，避免再次触发盗刷风险
          loadingEl.remove();
          addMessage('assistant', '🛡️ API 已暂时禁用（管理员正在维护）。如需使用，请稍后再试。');

          // ---- 未来恢复时，取消下面注释，并注释掉上面的模拟回复 ----
          /*
          const response = await fetch('YOUR_SECURE_PROXY_URL', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + 'YOUR_SERVER_SIDE_KEY'
            },
            body: JSON.stringify({
              model: 'glm-5.3-flash',
              messages: [
                { role: 'system', content: '你是一个友好的AI助手，请用中文回答。' },
                ...recent
              ],
              stream: false,
              max_tokens: 2048,
              temperature: 0.7
            })
          });

          loadingEl.remove();

          if (!response.ok) {
            const err = await response.json();
            let errMsg = err.error?.message || '请求失败，请稍后重试';
            if (errMsg.includes('balance') || errMsg.includes('quota')) {
              errMsg = '⚠️ 账户余额不足，请联系管理员。';
            } else if (errMsg.includes('api key') || errMsg.includes('unauthorized')) {
              errMsg = '⚠️ API Key 无效，请联系管理员。';
            }
            addMessage('assistant', `❌ ${errMsg}`);
            return;
          }

          const data = await response.json();
          const reply = data.choices?.[0]?.message?.content || '没有收到回复，请再试一次。';
          addMessage('assistant', reply);
          */

        } catch (err) {
          loadingEl.remove();
          addMessage('assistant', '⚠️ 网络连接失败，请检查网络后重试。');
          console.error('[API] 请求失败:', err);
        } finally {
          isLoading = false;
          inputEl.disabled = !chatEnabled;
          sendBtn.disabled = !chatEnabled;
          inputEl.focus();
        }
      }

      sendBtn.addEventListener('click', sendMessage);
      inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      console.log('✅ CAVEZ · 安全版小窗已加载（对话默认禁用，需手动启用）');
    })();
  </script>
</body>
</html>
