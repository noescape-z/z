<!DOCTYPE html>

      padding: 0;
      box-sizing: border-box;
      cursor: none !important;
    }

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

      color: #f0ece4;

    .custom-cursor {
      position: fixed;

      z-index: 9999;

      height: 18px;
      border-radius: 50%;
      background: rgba(245, 87, 108, 0.85);

      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, background 0.2s;
      will-change: transform;
      mix-blend-mode: difference;
    }

    .custom-cursor.hover {
      width: 36px;
      height: 36px;
      background: rgba(168, 85, 247, 0.7);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
    }

    /* ===== 动态粒子背景 ===== */
    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== 毛玻璃主容器 ===== */
    .glass-container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 2rem 1.5rem;
      min-height: 100vh;
      backdrop-filter: blur(14px) saturate(1.4);
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
      background: rgba(20, 18, 28, 0.45);
      border-left: 1px solid rgba(255, 255, 255, 0.06);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
    }

    /* ===== 头部 ===== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 2rem;
    }

    .logo a {
      font-size: 2rem;
      font-weight: 700;
      text-decoration: none;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .logo small {
      font-size: 0.85rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.4);
      -webkit-text-fill-color: rgba(255, 255, 255, 0.4);
      margin-left: 0.3rem;
    }

    nav {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
      padding: 0.3rem 0;
      border-bottom: 2px solid transparent;
      transition: all 0.25s ease;
      font-size: 0.95rem;
      cursor: none;
    }

    nav a:hover,
    nav a.active {
      color: #fff;
      border-bottom-color: #f5576c;
    }

    /* ===== 页面容器 ===== */
    .page {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ===== Hero（首页专用） ===== */
    .hero {
      padding: 1.5rem 0 0.5rem;
      margin-bottom: 2.5rem;
    }

    .hero h1 {
      font-size: 2.8rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .hero h1 span {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 1.15rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 0.2rem;
    }

    /* ===== 快速导航卡片（首页专用） ===== */
    .quick-nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1.2rem;
      margin: 2rem 0 3rem;

    .quick-nav a {

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 1.2rem 0.5rem;
      text-align: center;
      text-decoration: none;

    }

    .glass-card {

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.06);

      z-index: 999;
      font-weight: 500;
      transition: opacity 0.3s;

      text-align: center;
      pointer-events: none;

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {

  <!-- ===== JavaScript ===== -->
  <script>
    (function() {
      'use strict';

      // ============================================================
      // 1. 自定义光标
      // ============================================================
      const cursor = document.getElementById('customCursor');

      document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });

      document.addEventListener('mouseenter', () => {
        cursor.style.opacity = '1';
      });

      document.addEventListener('mouseleave', () => {
        cursor.style.opacity = '0';
      });

      // 悬停时放大
      document.querySelectorAll('a, button, .clickable').forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
        el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
      });

      // ============================================================
      // 2. 动态粒子背景
      // ============================================================
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let mouseX = 0;
      let mouseY = 0;
      let width, height;

      function resizeCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      class Particle {
        constructor() {
          this.reset();
        }

        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 3 + 1.5;
          this.speedX = (Math.random() - 0.5) * 0.5;
          this.speedY = (Math.random() - 0.5) * 0.5;
          this.opacity = Math.random() * 0.5 + 0.2;
          this.color = `hsla(${Math.random() * 60 + 320}, 70%, 65%, `;
        }

        update() {
          const dx = mouseX - this.x;
          const dy = mouseY - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 200) {
            const force = (200 - dist) / 200 * 0.02;
            this.x += dx * force;
            this.y += dy * force;
          }

          this.x += this.speedX;
          this.y += this.speedY;

          if (this.x < 0 || this.x > width) this.speedX *= -1;
          if (this.y < 0 || this.y > height) this.speedY *= -1;
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color + this.opacity + ')';
          ctx.fill();

          if (this.size > 2.5) {
            ctx.shadowColor = 'rgba(245, 87, 108, 0.15)';
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.shadowBlur = 0;
          }
        }
      }

      const particleCount = Math.min(120, Math.floor((width * height) / 8000));
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }

      function drawLines() {
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(180, 140, 220, ${0.08 * (1 - dist / 120)})`;
              ctx.lineWidth = 0.8;
              ctx.stroke();
            }
          }
        }
      }

      function animateParticles() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          p.update();
          p.draw();
        });
        drawLines();
        requestAnimationFrame(animateParticles);
      }
      animateParticles();

      // ============================================================
      // 3. 数据层 (localStorage)
      // ============================================================
      const STORAGE_KEY = 'cavez_blog_data';

      function getDefaultData() {
        return {
          updates: [
            { id: Date.now() - 3600000, text: '🎉 小窝正式开张，欢迎来做客！' },
            { id: Date.now() - 7200000, text: '📦 软件专区即将上线，敬请期待' },
          ],
          posts: [
            { id: Date.now() - 86400000, title: '📦 资源库大更新！', content: '🎉 又收集了一批好工具！<br>🔗 传送门：<a href="#" target="_blank">点击进入</a>', date: '2026-09-01' },
            { id: Date.now() - 172800000, title: '在算法洪流中，打捞一艘木帆船', content: '当全世界都在追逐效率与增长，我选择退回书桌一角，用最原始的方式——文字，来对抗遗忘。', date: '2026-08-30' },
          ]
        };
      }

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const data = JSON.parse(raw);
            if (data && typeof data === 'object') return data;
          }
        } catch (_) {}
        const def = getDefaultData();
        saveData(def);
        return def;
      }

      function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      // ============================================================
      // 4. 渲染函数
      // ============================================================
      function renderUpdates() {
        const container = document.getElementById('updateList');
        const data = loadData();
        const updates = data.updates || [];

        if (!updates.length) {
          container.innerHTML = `<div class="empty"><span class="icon">📭</span> 暂无更新</div>`;
          return;
        }

        const sorted = [...updates].sort((a, b) => b.id - a.id);

        container.innerHTML = sorted.map(item => `
          <div class="update-item">
            <div class="time">${new Date(item.id).toLocaleString('zh-CN')}</div>
            <div class="content">${item.text}</div>
          </div>
        `).join('');
      }

      function renderPosts() {
        const container = document.getElementById('postList');
        const data = loadData();
        const posts = data.posts || [];

        if (!posts.length) {
          container.innerHTML = `<div class="empty"><span class="icon">📝</span> 还没有文章，发布第一篇吧！</div>`;
          return;
        }

        const sorted = [...posts].sort((a, b) => b.id - a.id);

        container.innerHTML = sorted.map(post => `
          <div class="post-item" data-id="${post.id}">
            <div class="info">
              <div class="title">${post.title}</div>
              <div class="meta">${post.date || new Date(post.id).toLocaleDateString('zh-CN')}</div>
              <div style="margin-top:0.3rem;font-size:0.9rem;color:rgba(255,255,255,0.5);">${post.content}</div>
            </div>
            <div class="actions">
              <button class="del" data-id="${post.id}">🗑️ 删除</button>
            </div>
          </div>
        `).join('');

        container.querySelectorAll('.del').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = parseInt(this.dataset.id);
            if (confirm('确定要删除这篇文章吗？')) {
              const data = loadData();
              data.posts = data.posts.filter(p => p.id !== id);
              data.updates.push({
                id: Date.now(),
                text: '🗑️ 删除了文章'
              });
              saveData(data);
              renderPosts();
              renderUpdates();
              showToast('🗑️ 文章已删除');
            }
          });
        });
      }

      // ============================================================
      // 5. 发布文章
      // ============================================================
      function publishPost() {
        const titleEl = document.getElementById('postTitle');
        const contentEl = document.getElementById('postContent');
        const title = titleEl.value.trim();
        const content = contentEl.value.trim();

        if (!title) { showToast('请输入文章标题'); return; }
        if (!content) { showToast('请输入文章内容'); return; }

        const data = loadData();
        data.posts.push({
          id: Date.now(),
          title: title,
          content: content,
          date: new Date().toLocaleDateString('zh-CN'),
        });

        data.updates.push({
          id: Date.now(),
          text: `📄 发布了新文章：${title}`
        });

        saveData(data);

        titleEl.value = '';
        contentEl.value = '';

        renderPosts();
        renderUpdates();
        showToast('✅ 文章发布成功！');
      }

      // ============================================================
      // 6. 页面切换（核心修复）
      // ============================================================
      function switchPage(pageId) {
        // 隐藏所有页面
        document.querySelectorAll('.page').forEach(el => {
          el.classList.remove('active');
        });

        // 显示目标页面
        const target = document.getElementById('page-' + pageId);
        if (target) {
          target.classList.add('active');
        }

        // 更新导航高亮
        document.querySelectorAll('nav a').forEach(link => {
          link.classList.toggle('active', link.dataset.page === pageId);
        });

        // 如果切换到评论页，触发 Giscus 重新加载（可选）
        if (pageId === 'comments') {
          // Giscus 会自动加载，无需额外操作
        }
      }

      // ============================================================
      // 7. Toast
      // ============================================================
      function showToast(msg) {
        const old = document.querySelector('.custom-toast');
        if (old) old.remove();
        const toast = document.createElement('div');
        toast.className = 'custom-toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2500);
      }

      // ============================================================
      // 8. 初始化
      // ============================================================
      function init() {
        const data = loadData();
        if (!data.updates) data.updates = getDefaultData().updates;
        if (!data.posts) data.posts = getDefaultData().posts;
        saveData(data);

        renderUpdates();
        renderPosts();

        // ---- 导航切换（顶部导航） ----
        document.querySelectorAll('nav a').forEach(el => {
          el.addEventListener('click', function(e) {
            e.preventDefault();
            const page = this.dataset.page;
            if (page) switchPage(page);
          });
        });

        // ---- 快速导航卡片 ----
        document.querySelectorAll('.quick-nav a[data-page]').forEach(el => {
          el.addEventListener('click', function(e) {
            e.preventDefault();
            const page = this.dataset.page;
            if (page) switchPage(page);
          });
        });

        // ---- 登录触发 ----
        document.getElementById('loginTrigger').addEventListener('click', function(e) {
          e.preventDefault();
          showToast('🔐 登录/注册功能开发中，请关注后续更新');
        });

        // ---- 发布文章 ----
        document.getElementById('publishBtn').addEventListener('click', publishPost);

        // ---- 同步（本地） ----
        document.getElementById('syncBtn').addEventListener('click', function() {
          showToast('🔄 数据已同步到本地');
        });

        // ---- Ctrl+Enter 快捷发布 ----
        document.getElementById('postTitle').addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && e.ctrlKey) {
            e.preventDefault();
            publishPost();
          }
        });

        // ---- 默认显示首页 ----
        switchPage('home');
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>

</body>
</html>
