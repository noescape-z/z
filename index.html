<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOESCAPE-Z</title>
  <!-- Giscus 评论组件 (需要替换 repo-id 和 category-id) -->
  <script src="https://giscus.app/client.js"
    data-repo="noescape-z/z"
    data-repo-id="你的仓库ID"
    data-category="Announcements"
    data-category-id="你的分类ID"
    data-mapping="title"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="bottom"
    data-theme="transparent_dark"
    data-lang="zh-CN"
    data-loading="lazy"
    crossorigin="anonymous"
    async>
  </script>
  <style>
    /* ===== 全局重置 & 主题变量 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-body: #1a1410;
      --bg-sidebar: #0f0b08;
      --bg-card: #2a211a;
      --bg-input: #1a1410;
      --text-primary: #e8ddd0;
      --text-secondary: #b8a99a;
      --text-muted: #8a7a6a;
      --border-color: #3d3229;
      --accent: #d4a853;
      --accent-hover: #e8c06a;
      --shadow: rgba(0, 0, 0, 0.6);
      --radius: 12px;
      --transition: 0.25s ease;
    }

    [data-theme="dark"] {
      --bg-body: #080c14;
      --bg-sidebar: #040810;
      --bg-card: #121a2a;
      --bg-input: #080c14;
      --text-primary: #d6e2f0;
      --text-secondary: #8aa0c0;
      --text-muted: #5a72a0;
      --border-color: #1a2a4a;
      --accent: #4a8ad6;
      --accent-hover: #6aaaff;
      --shadow: rgba(0, 0, 0, 0.8);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-body);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      transition: background 0.3s, color 0.3s;
    }

    /* ===== 侧边栏 (桌面端) ===== */
    .sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      height: 100vh;
      position: sticky;
      top: 0;
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      flex-shrink: 0;
      transition: background 0.3s, border-color 0.3s, transform 0.3s ease;
      overflow-y: auto;
      z-index: 100;
    }

    .sidebar-brand {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent), var(--text-heading));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--border-color);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .sidebar-nav button {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1rem;
      padding: 0.6rem 1rem;
      border-radius: var(--radius);
      text-align: left;
      cursor: pointer;
      transition: all var(--transition);
      font-weight: 500;
      border: 1px solid transparent;
    }

    .sidebar-nav button:hover {
      background: var(--bg-card);
      color: var(--text-primary);
      border-color: var(--border-color);
    }

    .sidebar-nav button.active {
      background: var(--bg-card);
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .sidebar-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }

    .sidebar-footer .row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all var(--transition);
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    /* ---- LY 专属按钮 ---- */
    .ly-btn {
      background: transparent;
      border: 1px solid #a855f7;
      color: #a855f7;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all var(--transition);
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .ly-btn:hover {
      background: #a855f7;
      color: #fff;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
    }

    /* ---- LY 后台模式提示条 ---- */
    .ly-mode-banner {
      display: none;
      background: #a855f7;
      color: #fff;
      padding: 0.4rem 1.2rem;
      border-radius: var(--radius);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1.2rem;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .ly-mode-banner.active {
      display: flex;
    }

    .ly-mode-banner .close-ly {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 0.1rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all var(--transition);
      margin-left: auto;
    }

    .ly-mode-banner .close-ly:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* ===== 汉堡菜单按钮 (手机端) ===== */
    .hamburger {
      display: none;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 1.8rem;
      padding: 0.2rem 0.6rem;
      cursor: pointer;
      border-radius: var(--radius);
      transition: background 0.2s;
      position: fixed;
      top: 0.8rem;
      right: 1rem;
      z-index: 200;
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      line-height: 1;
    }

    .hamburger:hover {
      background: var(--bg-card);
    }

    /* ===== 主内容 ===== */
    .main {
      flex: 1;
      padding: 2rem 2.5rem;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      transition: background 0.3s;
    }

    .page {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .update-list {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .update-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.2rem 1.5rem;
      transition: all var(--transition);
    }

    .update-item:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 16px var(--shadow);
    }

    .update-item .time {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .update-item .content {
      font-size: 1rem;
      line-height: 1.6;
    }

    .post-controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    .post-controls input,
    .post-controls textarea {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.6rem 1rem;
      border-radius: var(--radius);
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
      font-family: inherit;
      flex: 1 1 200px;
    }

    .post-controls input:focus,
    .post-controls textarea:focus {
      border-color: var(--accent);
    }

    .post-controls textarea {
      resize: vertical;
      min-height: 80px;
      flex-basis: 100%;
    }

    .btn {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 0.5rem 1.4rem;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: scale(1.02);
    }

    .btn-danger {
      background: #c0705a;
    }

    .btn-danger:hover {
      background: #d4856e;
    }

    .post-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1rem;
    }

    .post-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.2rem 1.5rem;
      transition: all var(--transition);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .post-item:hover {
      border-color: var(--accent);
    }

    .post-item .info {
      flex: 1;
    }

    .post-item .title {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0.2rem;
    }

    .post-item .meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .post-item .actions {
      display: flex;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .post-item .actions button {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0.2rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all var(--transition);
    }

    .post-item .actions button:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .post-item .actions .del:hover {
      border-color: #d4856e;
      color: #d4856e;
    }

    .giscus-wrapper {
      margin-top: 1rem;
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
      border: 1px solid var(--border-color);
      min-height: 400px;
    }

    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    .empty .icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.5rem;
    }

    /* ===== LY 验证弹窗 ===== */
    .ly-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .ly-modal-overlay.active {
      display: flex;
    }

    .ly-modal {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 2rem;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 8px 32px var(--shadow);
      text-align: center;
    }

    .ly-modal h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .ly-modal p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 1.2rem;
    }

    .ly-modal input {
      width: 100%;
      padding: 0.6rem 1rem;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: var(--radius);
      font-size: 1rem;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
      transition: border 0.2s;
      margin-bottom: 1rem;
    }

    .ly-modal input:focus {
      border-color: #a855f7;
    }

    .ly-modal .btn-group {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
    }

    .ly-modal .btn-group button {
      padding: 0.4rem 1.6rem;
      border-radius: var(--radius);
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }

    .ly-modal .btn-group .btn-cancel {
      background: var(--border-color);
      color: var(--text-secondary);
    }

    .ly-modal .btn-group .btn-cancel:hover {
      background: var(--text-muted);
      color: #fff;
    }

    .ly-modal .btn-group .btn-confirm {
      background: #a855f7;
      color: #fff;
    }

    .ly-modal .btn-group .btn-confirm:hover {
      background: #7c3aed;
      transform: scale(1.02);
    }

    .ly-error {
      color: #f87171;
      font-size: 0.85rem;
      min-height: 1.5rem;
      margin-bottom: 0.5rem;
    }

    /* ===== Toast 提示 ===== */
    .custom-toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      color: var(--text-primary);
      padding: 0.8rem 2rem;
      border-radius: 12px;
      border: 1px solid var(--accent);
      box-shadow: 0 4px 20px var(--shadow);
      z-index: 999;
      font-weight: 500;
      transition: opacity 0.3s;
      max-width: 90%;
      text-align: center;
    }

    /* ============================================================ */
    /* ===== 响应式 - 移动端 ===== */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      /* 汉堡菜单显示 */
      .hamburger {
        display: block;
      }

      /* 侧边栏默认隐藏，通过 JS 控制显示 */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 280px;
        height: 100vh;
        transform: translateX(-100%);
        border-right: 1px solid var(--border-color);
        border-bottom: none;
        padding: 1.5rem 1.2rem;
        gap: 1.5rem;
        z-index: 150;
        box-shadow: 4px 0 20px var(--shadow);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      /* 侧边栏打开时，加一个遮罩 */
      .sidebar-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 140;
      }

      .sidebar-overlay.active {
        display: block;
      }

      .sidebar-brand {
        font-size: 1.3rem;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 0.5rem;
      }

      .sidebar-nav {
        flex-direction: column;
        gap: 0.3rem;
      }

      .sidebar-nav button {
        padding: 0.5rem 0.8rem;
        font-size: 0.95rem;
      }

      .sidebar-footer {
        flex-direction: column;
        gap: 0.5rem;
      }

      .sidebar-footer .row {
        flex-wrap: wrap;
      }

      .main {
        padding: 1.2rem;
        margin-top: 0.5rem;
      }

      .post-controls {
        flex-direction: column;
      }

      .post-controls input,
      .post-controls textarea {
        flex-basis: auto;
        width: 100%;
      }

      .post-item {
        flex-direction: column;
        align-items: stretch;
      }

      .post-item .actions {
        justify-content: flex-end;
      }

      .ly-mode-banner {
        font-size: 0.8rem;
        padding: 0.3rem 1rem;
      }

      .ly-mode-banner .close-ly {
        font-size: 0.7rem;
      }
    }

    @media (max-width: 480px) {
      .sidebar {
        width: 260px;
        padding: 1rem;
      }

      .sidebar-brand {
        font-size: 1.1rem;
      }

      .sidebar-nav button {
        font-size: 0.85rem;
        padding: 0.4rem 0.7rem;
      }

      .main {
        padding: 0.8rem;
      }

      .post-item {
        padding: 0.8rem 1rem;
      }

      .giscus-wrapper {
        padding: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- ===== 侧边栏遮罩 (手机端) ===== -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ===== 汉堡菜单按钮 (手机端) ===== -->
  <button class="hamburger" id="hamburgerBtn" aria-label="切换菜单">☰</button>

  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">NOESCAPE-Z</div>

    <nav class="sidebar-nav">
      <button class="active" data-page="home">🏠 首页</button>
      <button data-page="posts">📄 文章专区</button>
      <button data-page="comments">💬 评论</button>
    </nav>

    <div class="sidebar-footer">
      <div class="row">
        <button class="theme-toggle" id="themeToggle">🌓 切换主题</button>
        <button class="ly-btn" id="lyToggle">✦ LY</button>
      </div>
      <!-- 已移除 "⚡ 仅LY可点 · 生日验证" 提示 -->
    </div>
  </aside>

  <!-- ===== LY 验证弹窗 ===== -->
  <div class="ly-modal-overlay" id="lyModal">
    <div class="ly-modal">
      <h3>🔐 验证身份</h3>
      <p>请输入 LY 的生日 <span style="color:var(--accent);font-weight:600;">(MMDD)</span></p>
      <input type="password" id="lyPassword" placeholder="例: 0811" maxlength="4" inputmode="numeric">
      <div class="ly-error" id="lyError"></div>
      <div class="btn-group">
        <button class="btn-cancel" id="lyCancel">取消</button>
        <button class="btn-confirm" id="lyConfirm">确认</button>
      </div>
    </div>
  </div>

  <!-- ===== 主内容 ===== -->
  <main class="main">

    <!-- LY 模式提示条 -->
    <div class="ly-mode-banner" id="lyBanner">
      <span>🔓 当前为 <strong>LY 管理模式</strong> — 你可以发布/删除文章</span>
      <button class="close-ly" id="lyExit">退出管理</button>
    </div>

    <!-- ===== 首页 ===== -->
    <section id="page-home" class="page active">
      <h2 style="margin-bottom: 1.2rem;">📌 更新动态</h2>
      <div class="update-list" id="updateList">
        <!-- 由 JavaScript 动态渲染 -->
      </div>
    </section>

    <!-- ===== 文章专区 ===== -->
    <section id="page-posts" class="page">
      <h2 style="margin-bottom: 1.2rem;">📝 文章专区</h2>

      <div class="post-controls" id="postControls">
        <input type="text" id="postTitle" placeholder="文章标题">
        <textarea id="postContent" placeholder="文章内容（支持 Markdown / HTML）"></textarea>
        <button class="btn" id="publishBtn">📤 发布文章</button>
      </div>

      <div class="post-list" id="postList">
        <!-- 由 JavaScript 动态渲染 -->
      </div>
    </section>

    <!-- ===== 评论 ===== -->
    <section id="page-comments" class="page">
      <h2 style="margin-bottom: 1.2rem;">💬 评论 · Giscus</h2>
      <div class="giscus-wrapper" id="giscusWrapper">
        <div class="giscus"></div>
      </div>
    </section>

  </main>

  <!-- ============================================================ -->
  <!-- ===== JavaScript ===== -->
  <script>
    (function() {
      // ============================================================
      // 1. 数据层 (localStorage)
      // ============================================================
      const STORAGE_KEY = 'noescapez_blog_data';
      const LY_SESSION_KEY = 'ly_mode_active';

      function getDefaultData() {
        return {
          updates: [
            { id: Date.now() - 3600000, text: '🎉 博客正式上线，欢迎来访！' },
            { id: Date.now() - 7200000, text: '📦 资源库更新：新增一批学习资料' },
          ],
          posts: [
            { id: Date.now() - 86400000, title: '📦 喂喂喂资源库更新啦！', content: '🎉 资源库又有新货了！<br>🔗 传送门：<a href="https://1838190346.share.123pan.cn/123pan/gfigTd-P1SLH?pwd=1145#" target="_blank">点击进入</a>', date: '2026-07-26' },
            { id: Date.now() - 172800000, title: '在算法洪流中，打捞一艘木帆船', content: '当全世界都在追逐效率与增长，我选择退回书桌一角，用最原始的方式——文字，来对抗遗忘。', date: '2026-07-25' },
          ]
        };
      }

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const data = JSON.parse(raw);
            if (data && typeof data === 'object') return data;
          }
        } catch (_) {}
        const def = getDefaultData();
        saveData(def);
        return def;
      }

      function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      // ============================================================
      // 2. LY 模式管理
      // ============================================================
      let isLyMode = false;

      function checkLySession() {
        try {
          return sessionStorage.getItem(LY_SESSION_KEY) === 'true';
        } catch (_) { return false; }
      }

      function setLySession(active) {
        try {
          if (active) {
            sessionStorage.setItem(LY_SESSION_KEY, 'true');
          } else {
            sessionStorage.removeItem(LY_SESSION_KEY);
          }
        } catch (_) {}
        isLyMode = active;
        updateLyUI();
      }

      function updateLyUI() {
        const banner = document.getElementById('lyBanner');
        const controls = document.getElementById('postControls');
        const publishBtn = document.getElementById('publishBtn');

        if (isLyMode) {
          banner.classList.add('active');
          controls.style.display = 'flex';
          publishBtn.style.display = 'inline-block';
          document.querySelectorAll('.post-item .actions .del').forEach(el => {
            el.style.display = 'inline-block';
          });
        } else {
          banner.classList.remove('active');
          controls.style.display = 'none';
          publishBtn.style.display = 'none';
          document.querySelectorAll('.post-item .actions .del').forEach(el => {
            el.style.display = 'none';
          });
        }
      }

      function handleLyConfirm() {
        const input = document.getElementById('lyPassword');
        const error = document.getElementById('lyError');
        const val = input.value.trim();

        if (val === '0811') {
          error.textContent = '';
          setLySession(true);
          document.getElementById('lyModal').classList.remove('active');
          input.value = '';
          renderPosts();
          renderUpdates();
          showToast('✅ LY 验证通过，已进入管理模式');
        } else {
          error.textContent = '❌ 生日不正确，请重试';
          input.value = '';
          input.focus();
        }
      }

      function exitLyMode() {
        setLySession(false);
        renderPosts();
        renderUpdates();
        showToast('已退出 LY 管理模式');
      }

      // ============================================================
      // 3. Toast 提示
      // ============================================================
      function showToast(msg) {
        const old = document.querySelector('.custom-toast');
        if (old) old.remove();
        const toast = document.createElement('div');
        toast.className = 'custom-toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2000);
      }

      // ============================================================
      // 4. 渲染函数
      // ============================================================

      function renderUpdates() {
        const container = document.getElementById('updateList');
        const data = loadData();
        const updates = data.updates || [];

        if (!updates.length) {
          container.innerHTML = `<div class="empty"><span class="icon">📭</span> 暂无更新</div>`;
          return;
        }

        const sorted = [...updates].sort((a, b) => b.id - a.id);

        container.innerHTML = sorted.map(item => `
          <div class="update-item">
            <div class="time">${new Date(item.id).toLocaleString('zh-CN')}</div>
            <div class="content">${item.text}</div>
          </div>
        `).join('');
      }

      function renderPosts() {
        const container = document.getElementById('postList');
        const data = loadData();
        const posts = data.posts || [];

        if (!posts.length) {
          container.innerHTML = `<div class="empty"><span class="icon">📝</span> 还没有文章，发布第一篇吧！</div>`;
          updateLyUI();
          return;
        }

        const sorted = [...posts].sort((a, b) => b.id - a.id);

        container.innerHTML = sorted.map(post => {
          const showDelete = isLyMode ? 'inline-block' : 'none';
          return `
          <div class="post-item" data-id="${post.id}">
            <div class="info">
              <div class="title">${post.title}</div>
              <div class="meta">${post.date || new Date(post.id).toLocaleDateString('zh-CN')}</div>
              <div style="margin-top:0.3rem;font-size:0.9rem;color:var(--text-secondary);">${post.content}</div>
            </div>
            <div class="actions">
              <button class="del" data-id="${post.id}" style="display:${showDelete}">🗑️ 删除</button>
            </div>
          </div>
        `}).join('');

        container.querySelectorAll('.del').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (!isLyMode) {
              showToast('⚠️ 请先通过 LY 验证');
              return;
            }
            const id = parseInt(this.dataset.id);
            if (confirm('确定要删除这篇文章吗？')) {
              const data = loadData();
              data.posts = data.posts.filter(p => p.id !== id);
              saveData(data);
              renderPosts();
              renderUpdates();
              showToast('🗑️ 文章已删除');
            }
          });
        });

        updateLyUI();
      }

      // ============================================================
      // 5. 发布文章
      // ============================================================
      function publishPost() {
        if (!isLyMode) {
          showToast('⚠️ 请先通过 LY 验证');
          return;
        }

        const titleEl = document.getElementById('postTitle');
        const contentEl = document.getElementById('postContent');
        const title = titleEl.value.trim();
        const content = contentEl.value.trim();

        if (!title) { showToast('请输入文章标题'); return; }
        if (!content) { showToast('请输入文章内容'); return; }

        const data = loadData();
        data.posts.push({
          id: Date.now(),
          title: title,
          content: content,
          date: new Date().toLocaleDateString('zh-CN'),
        });

        data.updates.push({
          id: Date.now(),
          text: `📄 发布了新文章：${title}`
        });

        saveData(data);

        titleEl.value = '';
        contentEl.value = '';

        renderPosts();
        renderUpdates();
        showToast('✅ 文章发布成功！');
      }

      // ============================================================
      // 6. 页面切换
      // ============================================================
      function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
        const target = document.getElementById('page-' + pageId);
        if (target) target.classList.add('active');

        document.querySelectorAll('.sidebar-nav button').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.page === pageId);
        });

        // 手机端切换页面后自动关闭侧边栏
        closeSidebar();
      }

      // ============================================================
      // 7. 主题切换
      // ============================================================
      function toggleTheme() {
        const html = document.documentElement;
        const current = html.getAttribute('data-theme');
        const next = current === 'dark' ? '' : 'dark';
        if (next) {
          html.setAttribute('data-theme', 'dark');
        } else {
          html.removeAttribute('data-theme');
        }
        try {
          const iframe = document.querySelector('.giscus-frame');
          if (iframe && iframe.contentWindow) {
            const theme = next === 'dark' ? 'dark' : 'light';
            iframe.contentWindow.postMessage({
              giscus: { setConfig: { theme: theme } }
            }, 'https://giscus.app');
          }
        } catch (_) {}
      }

      // ============================================================
      // 8. 汉堡菜单 (手机端)
      // ============================================================
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const hamburger = document.getElementById('hamburgerBtn');

      function toggleSidebar() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
        hamburger.textContent = sidebar.classList.contains('open') ? '✕' : '☰';
      }

      function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
        hamburger.textContent = '☰';
      }

      // ============================================================
      // 9. 初始化
      // ============================================================
      function init() {
        // 加载数据
        const data = loadData();
        if (!data.updates) data.updates = getDefaultData().updates;
        if (!data.posts) data.posts = getDefaultData().posts;
        saveData(data);

        // 检查 LY 会话
        isLyMode = checkLySession();

        // 渲染
        renderUpdates();
        renderPosts();
        updateLyUI();

        // 侧边栏导航
        document.querySelectorAll('.sidebar-nav button').forEach(btn => {
          btn.addEventListener('click', function() {
            switchPage(this.dataset.page);
          });
        });

        // 发布按钮
        document.getElementById('publishBtn').addEventListener('click', publishPost);

        // 主题切换
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);

        // LY 按钮
        document.getElementById('lyToggle').addEventListener('click', function() {
          if (isLyMode) {
            if (confirm('当前已是 LY 管理模式，是否退出？')) {
              exitLyMode();
            }
            return;
          }
          document.getElementById('lyModal').classList.add('active');
          document.getElementById('lyPassword').value = '';
          document.getElementById('lyError').textContent = '';
          setTimeout(() => document.getElementById('lyPassword').focus(), 100);
        });

        // LY 弹窗 - 确认
        document.getElementById('lyConfirm').addEventListener('click', handleLyConfirm);

        // LY 弹窗 - 取消
        document.getElementById('lyCancel').addEventListener('click', function() {
          document.getElementById('lyModal').classList.remove('active');
          document.getElementById('lyPassword').value = '';
          document.getElementById('lyError').textContent = '';
        });

        // LY 弹窗 - 回车
        document.getElementById('lyPassword').addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            handleLyConfirm();
          }
        });

        // LY 弹窗 - 点击遮罩关闭
        document.getElementById('lyModal').addEventListener('click', function(e) {
          if (e.target === this) {
            this.classList.remove('active');
            document.getElementById('lyPassword').value = '';
            document.getElementById('lyError').textContent = '';
          }
        });

        // LY 退出按钮
        document.getElementById('lyExit').addEventListener('click', exitLyMode);

        // ★★★ 汉堡菜单事件 ★★★
        hamburger.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', closeSidebar);

        // 窗口尺寸变化时，如果宽度 > 768px 自动关闭侧边栏
        window.addEventListener('resize', function() {
          if (window.innerWidth > 768) {
            closeSidebar();
          }
        });

        // 默认激活首页
        switchPage('home');
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>

</body>
</html>
