<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的博客</title>
    <style>
        /* ============================================================
               主题 1：暖深色（默认）
               ============================================================ */
        :root {
            --bg-primary: #1a1410;
            --bg-secondary: #241d17;
            --bg-tertiary: #332a22;
            --bg-card: rgba(42, 33, 26, 0.78);
            --text-primary: #e8ddd0;
            --text-secondary: #b8a99a;
            --text-heading: #f5ede4;
            --text-muted: #8a7a6a;
            --border-color: #3d3229;
            --border-light: #4d3f34;
            --accent-primary: #d4a853;
            --accent-hover: #e8c06a;
            --accent-blue: #7a9bcb;
            --accent-green: #6b9f6b;
            --accent-red: #c0705a;
            --accent-red-hover: #d4856e;
            --gradient-start: #f5ede4;
            --gradient-end: #d4a853;
            --modal-bg: #241d17;
            --input-bg: #1a1410;
            --toast-bg: #241d17;
            --shadow-color: rgba(0, 0, 0, 0.85);
            --badge-bg: #8a6a3a;
            --badge-text: #f5ede4;
            --btn-primary-bg: #8a6a3a;
            --btn-primary-hover: #a8844a;
            --btn-primary-text: #f5ede4;
            --tag-bg: #332a22;
            --tag-text: #b8a99a;
            --scrollbar-track: #1a1410;
            --scrollbar-thumb: #3d3229;
            --like-color: #e8c06a;
            --like-color-active: #ff6b6b;
            --link-color: #d4a853;
            --link-hover: #e8c06a;
            --comment-border: #3d3229;
            --comment-bg: rgba(42, 33, 26, 0.5);
            --loading-color: #d4a853;
        }

        /* ============================================================
               主题 2：冷暗色
               ============================================================ */
        [data-theme="dark"] {
            --bg-primary: #080c14;
            --bg-secondary: #0f1624;
            --bg-tertiary: #1a2438;
            --bg-card: rgba(18, 26, 42, 0.78);
            --text-primary: #d6e2f0;
            --text-secondary: #8aa0c0;
            --text-heading: #eaf0f8;
            --text-muted: #5a72a0;
            --border-color: #1a2a4a;
            --border-light: #2a3a5a;
            --accent-primary: #4a8ad6;
            --accent-hover: #6aaaff;
            --accent-blue: #4a8ad6;
            --accent-green: #3a9a7a;
            --accent-red: #d06060;
            --accent-red-hover: #e87878;
            --gradient-start: #8ab0e8;
            --gradient-end: #6a6ad4;
            --modal-bg: #0f1624;
            --input-bg: #080c14;
            --toast-bg: #0f1624;
            --shadow-color: rgba(0, 0, 0, 0.9);
            --badge-bg: #2a4a7a;
            --badge-text: #d6e2f0;
            --btn-primary-bg: #2a4a7a;
            --btn-primary-hover: #3a6aaa;
            --btn-primary-text: #d6e2f0;
            --tag-bg: #1a2438;
            --tag-text: #8aa0c0;
            --scrollbar-track: #080c14;
            --scrollbar-thumb: #1a2a4a;
            --like-color: #6aaaff;
            --like-color-active: #ff6b6b;
            --link-color: #4a8ad6;
            --link-hover: #6aaaff;
            --comment-border: #1a2a4a;
            --comment-bg: rgba(18, 26, 42, 0.5);
            --loading-color: #4a8ad6;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

        /* ===== 动态粒子画布 ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            display: block;
        }

        /* ===== 全局 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            line-height: 1.7;
            transition: background 0.5s ease, color 0.5s ease;
            position: relative;
            z-index: 1;
            overflow-x: hidden;
        }

        .container { max-width: 900px; width: 100%; position: relative; z-index: 2; }

        /* ===== 链接 ===== */
        a { color: var(--link-color); text-decoration: none; transition: color 0.3s ease; }
        a:hover { color: var(--link-hover); text-decoration: underline; }

        /* ===== 头部 ===== */
        header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1.5rem;
            margin-bottom: 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            transition: border-color 0.5s ease;
            backdrop-filter: blur(12px);
            background: rgba(26, 20, 16, 0.25);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        [data-theme="dark"] header { background: rgba(8, 12, 20, 0.3); }

        header .header-left h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: background 0.5s ease;
        }
        header .header-left .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 0.1rem;
            transition: color 0.5s ease;
        }

        .header-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .header-actions .btn-sm {
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .header-actions .btn-sm:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-color: var(--border-light);
        }
        .header-actions .btn-sm.primary {
            border-color: var(--btn-primary-bg);
            color: var(--accent-primary);
        }
        .header-actions .btn-sm.primary:hover {
            background: var(--btn-primary-bg);
            color: var(--btn-primary-text);
            border-color: var(--btn-primary-bg);
        }

        /* ===== 主题切换 ===== */
        .theme-toggle {
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.4s ease;
            white-space: nowrap;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .theme-toggle:hover {
            transform: scale(1.04);
            border-color: var(--accent-primary);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        .theme-toggle .icon { display: inline-block; transition: transform 0.6s ease; }
        .theme-toggle:hover .icon { transform: rotate(30deg); }

        /* ===== 文章 ===== */
        .blog-post {
            margin-bottom: 2.5rem;
            padding: 1.5rem 2rem;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.5s ease;
            backdrop-filter: blur(8px);
            cursor: pointer;
        }
        .blog-post:hover {
            border-color: var(--border-light);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }
        .blog-post:last-child { margin-bottom: 0; }

        .blog-post .post-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: color 0.5s ease;
        }

        .blog-post .post-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-heading);
            transition: color 0.5s ease;
        }
        .blog-post .post-header h2 a { color: inherit; text-decoration: none; }
        .blog-post .post-header h2 a:hover { color: var(--accent-primary); }

        .blog-post .post-excerpt {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 0.5rem;
            transition: color 0.5s ease;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .blog-post .post-tags {
            margin-top: 0.8rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .blog-post .post-tags span {
            background: var(--tag-bg);
            padding: 0.15rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            color: var(--tag-text);
            border: 1px solid var(--border-color);
            transition: all 0.4s ease;
            font-weight: 500;
        }
        .blog-post .post-tags span:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
        }

        .blog-post .post-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .blog-post .post-meta span { display: flex; align-items: center; gap: 0.3rem; }

        /* ===== 文章详情 ===== */
        .post-detail { display: none; }
        .post-detail.active { display: block; }

        .post-detail .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 1.2rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }
        .post-detail .back-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-color: var(--border-light);
        }

        .post-detail .post-full-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 0.5rem;
            transition: color 0.5s ease;
        }
        .post-detail .post-full-date {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .post-detail .post-full-content {
            color: var(--text-primary);
            font-size: 1.05rem;
            line-height: 1.9;
            transition: color 0.5s ease;
        }
        .post-detail .post-full-content img { max-width: 100%; border-radius: 8px; }
        .post-detail .post-full-content blockquote {
            border-left: 3px solid var(--accent-primary);
            padding-left: 1rem;
            margin: 1rem 0;
            color: var(--text-secondary);
        }
        .post-detail .post-full-content code {
            background: var(--bg-tertiary);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .post-detail .post-full-content pre {
            background: var(--bg-tertiary);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
        }

        /* ===== ★★★ Giscus 评论区 ★★★ ===== */
        .comments-section {
            margin-top: 2.5rem;
            padding: 1.5rem 2rem;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            transition: all 0.5s ease;
        }
        .comments-section:hover { border-color: var(--border-light); }
        .comments-section .comments-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-heading);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .giscus-wrapper { min-height: 150px; }

        /* ===== 加载状态 ===== */
        .loading-state {
            text-align: center;
            padding: 2rem 0;
            color: var(--text-muted);
        }
        .loading-state .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top-color: var(--loading-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 0.8rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== 列表/详情切换 ===== */
        .list-view { display: block; }
        .list-view.hidden { display: none; }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
            transition: color 0.5s ease;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
        }
        .empty-state p { font-size: 1.1rem; }
        .empty-state .empty-icon { font-size: 3rem; margin-bottom: 1rem; display: block; }

        /* ===== 页脚 ===== */
        footer {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--border-color);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: all 0.5s ease;
            letter-spacing: 0.5px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.8rem 2rem;
            border-radius: 12px;
            background: var(--toast-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 0.95rem;
            z-index: 2000;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
        }
        .toast.show { opacity: 1; }
        .toast.success { border-color: var(--accent-green); color: var(--accent-green); }
        .toast.error { border-color: var(--accent-red); color: var(--accent-red-hover); }
        .toast.info { border-color: var(--accent-primary); color: var(--accent-primary); }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            body { padding: 1rem 0.8rem; }
            header { padding: 0.8rem 1rem; flex-direction: column; align-items: stretch; }
            header .header-left h1 { font-size: 1.8rem; }
            .header-actions { justify-content: flex-start; }
            .blog-post { padding: 1rem 1.2rem; }
            .blog-post .post-header h2 { font-size: 1.3rem; }
            .header-actions .btn-sm, .theme-toggle { font-size: 0.7rem; padding: 0.3rem 0.7rem; }
            .theme-toggle { border-radius: 16px; }
            .post-detail .post-full-title { font-size: 1.5rem; }
            .comments-section { padding: 1rem 1.2rem; }
        }
    </style>
</head>

                let targetMouseX = -9999, targetMouseY = -9999;
                const PARTICLE_COUNT = 100;
                const CONNECTION_DIST = 160;
                const MOUSE_RADIUS = 180;

                function resize() {
                    W = window.innerWidth;
                    H = window.innerHeight;
                    canvas.width = W;
                    canvas.height = H;
                }

                function getParticleColors() {
                    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                    return isDark ?
                        { primary: '74, 138, 214', secondary: '106, 170, 255', tertiary: '50, 100, 180' } :
                        { primary: '212, 168, 83', secondary: '232, 192, 106', tertiary: '180, 140, 70' };
                }

                class Particle {
                    constructor() { this.reset(true); }
                    reset() {
                        this.x = Math.random() * W;
                        this.y = Math.random() * H;
                        this.size = Math.random() * 2.5 + 1.2;
                        this.baseSize = this.size;
                        this.opacity = Math.random() * 0.4 + 0.2;
                        this.originX = this.x;
                        this.originY = this.y;
                        this.phase = Math.random() * Math.PI * 2;
                        this.speed = 0.005 + Math.random() * 0.01;
                        this.colorOffset = Math.random();
                    }
                    update() {
                        const dx = this.x - mouseX, dy = this.y - mouseY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < MOUSE_RADIUS && dist > 0) {
                            const force = (1 - dist / MOUSE_RADIUS) * 1.0;
                            const angle = Math.atan2(dy, dx);
                            this.x += Math.cos(angle) * force * 0.7;
                            this.y += Math.sin(angle) * force * 0.7;
                            this.size = this.baseSize + force * 1.8;
                            this.opacity = Math.min(0.8, this.opacity + force * 0.25);
                        } else {
                            this.x += (this.originX - this.x) * 0.003;
                            this.y += (this.originY - this.y) * 0.003;
                            this.phase += this.speed;
                            this.x += Math.sin(this.phase) * 0.08;
                            this.y += Math.cos(this.phase * 0.7) * 0.08;
                            this.size += (this.baseSize - this.size) * 0.02;
                            this.opacity += (0.2 + Math.random() * 0.1 - this.opacity) * 0.01;
                        }
                        this.x = Math.max(0, Math.min(W, this.x));
                        this.y = Math.max(0, Math.min(H, this.y));
                        this.originX += (this.x - this.originX) * 0.001;
                        this.originY += (this.y - this.originY) * 0.001;
                    }
                    draw() {
                        const colors = getParticleColors();
                        let color = this.colorOffset < 0.33 ? colors.primary :
                            this.colorOffset < 0.66 ? colors.secondary : colors.tertiary;
                        const alpha = Math.min(0.8, this.opacity);
                        const radius = Math.max(0.5, this.size);
                        if (radius > 1.5) {
                            const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, radius * 2.5);
                            gradient.addColorStop(0, `rgba(${color}, ${alpha * 0.7})`);
                            gradient.addColorStop(0.3, `rgba(${color}, ${alpha * 0.25})`);
                            gradient.addColorStop(1, `rgba(${color}, 0)`);
                            ctx.beginPath();
                            ctx.arc(this.x, this.y, radius * 2.5, 0, Math.PI * 2);
                            ctx.fillStyle = gradient;
                            ctx.fill();
                        }
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, radius * 0.5, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${color}, ${alpha * 0.9})`;
                        ctx.fill();
                        if (radius > 1.2) {
                            ctx.beginPath();
                            ctx.arc(this.x - radius * 0.12, this.y - radius * 0.12, radius * 0.18, 0, Math.PI * 2);
                            ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.2})`;
                            ctx.fill();
                        }
                    }
                }

                function drawConnections() {
                    const colors = getParticleColors();
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < CONNECTION_DIST) {
                                const alpha = (1 - dist / CONNECTION_DIST) * 0.2;
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = `rgba(${colors.primary}, ${alpha})`;
                                ctx.lineWidth = 0.5;
                                ctx.stroke();
                            }
                        }
                    }
                }

                function drawMouseGlow() {
                    if (mouseX < 0 || mouseY < 0) return;
                    const colors = getParticleColors();
                    const gradient = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, MOUSE_RADIUS * 1.2);
                    gradient.addColorStop(0, `rgba(${colors.primary}, 0.05)`);
                    gradient.addColorStop(0.5, `rgba(${colors.secondary}, 0.025)`);
                    gradient.addColorStop(1, `rgba(${colors.primary}, 0)`);
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, W, H);
                    ctx.beginPath();
                    ctx.arc(mouseX, mouseY, 6, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${colors.primary}, 0.07)`;
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(mouseX, mouseY, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${colors.primary}, 0.12)`;
                    ctx.fill();
                }

                function initParticles() {
                    particles = [];
                    for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
                }

                function animate() {
                    mouseX += (targetMouseX - mouseX) * 0.08;
                    mouseY += (targetMouseY - mouseY) * 0.08;
                    ctx.clearRect(0, 0, W, H);
                    drawMouseGlow();
                    particles.forEach(p => { p.update(); p.draw(); });
                    drawConnections();
                    requestAnimationFrame(animate);
                }

                document.addEventListener('mousemove', function(e) {
                    targetMouseX = e.clientX;
                    targetMouseY = e.clientY;
                });
                document.addEventListener('mouseleave', function() {
                    targetMouseX = -9999;
                    targetMouseY = -9999;
                });
                document.addEventListener('touchmove', function(e) {
                    const touch = e.touches[0];
                    if (touch) { targetMouseX = touch.clientX;
                        targetMouseY = touch.clientY; }
                }, { passive: true });
                document.addEventListener('touchend', function() {
                    targetMouseX = -9999;
                    targetMouseY = -9999;
                });

                let resizeTimeout;
                window.addEventListener('resize', function() {
                    clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(function() { resize();
                        initParticles(); }, 300);
                });

                resize();
                initParticles();
                animate();
            })();

            // ============================================================
            //  主题管理
            // ============================================================
            function getTheme() {
                try { return localStorage.getItem(THEME_KEY) || 'default'; } catch (e) { return 'default'; }
            }

            function setTheme(theme) {
                try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
                applyTheme(theme);
            }

            function applyTheme(theme) {
                const html = document.documentElement;
                const btnText = document.getElementById('theme-btn-text');
                const icon = document.querySelector('.theme-toggle .icon');
                const label = document.getElementById('theme-label');
                if (theme === 'dark') {
                    html.setAttribute('data-theme', 'dark');
                    btnText.textContent = '暖色';
                    icon.textContent = '☀️';
                    label.textContent = '冷蓝之境 · 静夜思';
                } else {
                    html.removeAttribute('data-theme');
                    btnText.textContent = '冷色';
                    icon.textContent = '🌙';
                    label.textContent = '写于无人之境 · 仅供同频者阅';
                }
                updateGiscusTheme();
            }

            function toggleTheme() {
                const current = getTheme();
                const next = current === 'dark' ? 'default' : 'dark';
                setTheme(next);
                showToast(next === 'dark' ? '🌙 切换到冷暗色模式' : '☀️ 切换到暖深色模式', 'info');
            }

            // ============================================================
            //  Giscus 主题同步
            // ============================================================
            function updateGiscusTheme() {
                const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
                const iframe = document.querySelector('.giscus-frame');
                if (iframe && iframe.contentWindow) {
                    try {
                        iframe.contentWindow.postMessage({
                            giscus: { setConfig: { theme: theme === 'dark' ? 'dark' : 'light' } }
                        }, 'https://giscus.app');
                    } catch (e) {}
                }
                const giscusScript = document.querySelector('script[src*="giscus"]');
                if (giscusScript) {
                    giscusScript.setAttribute('data-theme', theme === 'dark' ? 'transparent_dark' : 'light');
                }
            }

            const themeObserverGiscus = new MutationObserver(function() { updateGiscusTheme(); });
            themeObserverGiscus.observe(document.documentElement, {
                attributes: true,
                attributeFilter: ['data-theme']
            });

            // ============================================================
            //  Toast
            // ============================================================
            let toastTimer = null;

            function showToast(message, type = 'info') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = 'toast ' + type + ' show';
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 3000);
            }

            // ============================================================
            //  渲染文章列表
            // ============================================================
            function renderPostList() {
                const container = document.getElementById('post-list');
                if (!container) return;

                if (!POSTS || POSTS.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <span class="empty-icon">📝</span>
                            <p>还没有文章</p>
                            <p style="font-size:0.9rem;color:var(--text-muted);margin-top:0.5rem;">
                                点击右上角「写新文章」在 GitHub 上创建
                            </p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                POSTS.forEach(post => {
                    const tagsHtml = post.tags && post.tags.length ?
                        post.tags.map(t => `<span>#${t.trim()}</span>`).join('') : '';
                    html += `
                        <div class="blog-post" data-id="${post.id}">
                            <div class="post-header">
                                <h2><a href="#" data-id="${post.id}">${post.title}</a></h2>
                            </div>
                            <div class="post-date">${post.date}</div>
                            <div class="post-excerpt">${post.excerpt || post.content.substring(0, 120) + '...'}</div>
                            ${tagsHtml ? `<div class="post-tags">${tagsHtml}</div>` : ''}
                            <div class="post-meta">
                                <span>💬 点击阅读 →</span>
                                <span>📅 ${post.date}</span>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

                // 绑定点击事件
                container.querySelectorAll('.blog-post').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.tagName === 'A') return;
                        const id = parseInt(this.dataset.id);
                        openPostDetail(id);
                    });
                });

                container.querySelectorAll('.blog-post a').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.preventDefault();
                        const id = parseInt(this.dataset.id);
                        openPostDetail(id);
                    });
                });
            }

            // ============================================================
            //  文章详情
            // ============================================================
            let currentPostId = null;

            function openPostDetail(postId) {
                const post = POSTS.find(p => p.id === postId);
                if (!post) {
                    showToast('文章不存在', 'error');
                    return;
                }

                currentPostId = postId;

                document.getElementById('list-view').classList.add('hidden');
                document.getElementById('post-detail').classList.add('active');

                document.getElementById('post-full-title').textContent = post.title;
                document.getElementById('post-full-date').textContent = post.date;
                document.getElementById('post-full-content').innerHTML = post.content;

                // ★★★ 加载 Giscus 评论区 ★★★
                loadGiscusForPost(post.title);

                document.querySelector('.container').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            function goBackToList() {
                document.getElementById('list-view').classList.remove('hidden');
                document.getElementById('post-detail').classList.remove('active');
                document.querySelector('.container').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            // ============================================================
            //  ★★★ ★★★ ★★★ 加载 Giscus ★★★ ★★★ ★★★
            // ============================================================
            function loadGiscusForPost(title) {
                const wrapper = document.getElementById('giscus-wrapper');
                if (!wrapper) return;

                // 显示加载状态
                wrapper.innerHTML = `
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>⏳ 加载评论区...</p>
                    </div>
                `;

                // 移除旧的 script
                const oldScripts = wrapper.querySelectorAll('script');
                oldScripts.forEach(s => s.remove());

                // ★★★ 创建新的 Giscus script ★★★
                const script = document.createElement('script');
                script.src = 'https://giscus.app/client.js';
                // ⚠️ 请将下面的值替换为你的实际配置
                script.setAttribute('data-repo', GISCUS_CONFIG.repo);
                script.setAttribute('data-repo-id', GISCUS_CONFIG.repoId);
                script.setAttribute('data-category', GISCUS_CONFIG.category);
                script.setAttribute('data-category-id', GISCUS_CONFIG.categoryId);
                script.setAttribute('data-mapping', 'title');
                script.setAttribute('data-strict', '0');
                script.setAttribute('data-reactions-enabled', '1');
                script.setAttribute('data-emit-metadata', '0');
                script.setAttribute('data-input-position', 'bottom');
                const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
                script.setAttribute('data-theme', theme === 'dark' ? 'transparent_dark' : 'light');
                script.setAttribute('data-lang', 'zh-CN');
                script.setAttribute('data-loading', 'lazy');
                script.setAttribute('crossorigin', 'anonymous');
                script.async = true;

                // 加载完成后移除 loading
                script.onload = function() {
                    setTimeout(() => {
                        const loading = wrapper.querySelector('.loading-state');
                        if (loading) loading.style.display = 'none';
                    }, 2000);
                };

                wrapper.appendChild(script);

                // 5秒后自动移除 loading
                setTimeout(() => {
                    const loading = wrapper.querySelector('.loading-state');
                    if (loading) loading.style.display = 'none';
                }, 5000);

                // ★★★ 同时更新"写新文章"链接 ★★★
                updateNewPostLink(title);
            }

            // ============================================================
            //  ★★★ 更新"写新文章"链接 ★★★
            // ============================================================
            function updateNewPostLink(title) {
                const link = document.getElementById('new-post-link');
                if (!link) return;
                // 跳转到 GitHub 创建新 Discussion
                const repo = GISCUS_CONFIG.repo;
                const category = GISCUS_CONFIG.category;
                link.href = `https://github.com/${repo}/discussions/new?category=${encodeURIComponent(category)}`;
                link.target = '_blank';
                // 如果有当前文章标题，可以预填
                if (title) {
                    // 通过 URL 参数预填标题（GitHub 支持）
                    link.href += `&title=${encodeURIComponent(title)}`;
                }
            }

            // ============================================================
            //  初始化
            // ============================================================
            function init() {
                // 主题
                const theme = getTheme();
                applyTheme(theme);
                document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

                // 返回按钮
                document.getElementById('back-btn').addEventListener('click', goBackToList);

                // 渲染文章列表
                renderPostList();

                // 更新"写新文章"链接
                updateNewPostLink('');

                // 默认选中第一篇
                if (POSTS.length > 0) {
                    setTimeout(() => {
                        // 加载第一篇文章的评论区（作为默认）
                        loadGiscusForPost(POSTS[0].title);
                    }, 1500);
                }

                // Giscus 主题同步延迟
                setTimeout(updateGiscusTheme, 2000);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
