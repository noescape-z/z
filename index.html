<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOESCAPE-Z · 个人博客</title>
  <!-- 使用 Giscus 评论组件 -->
  <script src="https://giscus.app/client.js"
    data-repo="noescape-z/z"
    data-repo-id="你的仓库ID"
    data-category="Announcements"
    data-category-id="你的分类ID"
    data-mapping="title"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="bottom"
    data-theme="transparent_dark"
    data-lang="zh-CN"
    data-loading="lazy"
    crossorigin="anonymous"
    async>
  </script>
  <style>
    /* ===== 全局重置 & 主题变量 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* 暖深色 (默认) */
      --bg-body: #1a1410;
      --bg-sidebar: #0f0b08;
      --bg-card: #2a211a;
      --bg-input: #1a1410;
      --text-primary: #e8ddd0;
      --text-secondary: #b8a99a;
      --text-muted: #8a7a6a;
      --border-color: #3d3229;
      --accent: #d4a853;
      --accent-hover: #e8c06a;
      --shadow: rgba(0, 0, 0, 0.6);
      --radius: 12px;
      --transition: 0.25s ease;
    }

    [data-theme="dark"] {
      /* 冷暗色 */
      --bg-body: #080c14;
      --bg-sidebar: #040810;
      --bg-card: #121a2a;
      --bg-input: #080c14;
      --text-primary: #d6e2f0;
      --text-secondary: #8aa0c0;
      --text-muted: #5a72a0;
      --border-color: #1a2a4a;
      --accent: #4a8ad6;
      --accent-hover: #6aaaff;
      --shadow: rgba(0, 0, 0, 0.8);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-body);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      transition: background 0.3s, color 0.3s;
    }

    /* ===== 侧边栏 ===== */
    .sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      height: 100vh;
      position: sticky;
      top: 0;
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      flex-shrink: 0;
      transition: background 0.3s, border-color 0.3s;
      overflow-y: auto;
    }

    .sidebar-brand {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent), var(--text-heading));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--border-color);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .sidebar-nav button {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1rem;
      padding: 0.6rem 1rem;
      border-radius: var(--radius);
      text-align: left;
      cursor: pointer;
      transition: all var(--transition);
      font-weight: 500;
      border: 1px solid transparent;
    }

    .sidebar-nav button:hover {
      background: var(--bg-card);
      color: var(--text-primary);
      border-color: var(--border-color);
    }

    .sidebar-nav button.active {
      background: var(--bg-card);
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    /* 侧边栏底部主题切换 */
    .sidebar-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }

    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all var(--transition);
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    /* ===== 主内容 ===== */
    .main {
      flex: 1;
      padding: 2rem 2.5rem;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      transition: background 0.3s;
    }

    /* 页面区块 */
    .page {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ===== 首页 ===== */
    .update-list {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .update-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.2rem 1.5rem;
      transition: all var(--transition);
    }

    .update-item:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 16px var(--shadow);
    }

    .update-item .time {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .update-item .content {
      font-size: 1rem;
      line-height: 1.6;
    }

    /* ===== 文章专区 ===== */
    .post-controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    .post-controls input,
    .post-controls textarea {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.6rem 1rem;
      border-radius: var(--radius);
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
      font-family: inherit;
      flex: 1 1 200px;
    }

    .post-controls input:focus,
    .post-controls textarea:focus {
      border-color: var(--accent);
    }

    .post-controls textarea {
      resize: vertical;
      min-height: 80px;
      flex-basis: 100%;
    }

    .btn {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 0.5rem 1.4rem;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: scale(1.02);
    }

    .btn-danger {
      background: #c0705a;
    }

    .btn-danger:hover {
      background: #d4856e;
    }

    .post-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1rem;
    }

    .post-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.2rem 1.5rem;
      transition: all var(--transition);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .post-item:hover {
      border-color: var(--accent);
    }

    .post-item .info {
      flex: 1;
    }

    .post-item .title {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0.2rem;
    }

    .post-item .meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .post-item .actions {
      display: flex;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .post-item .actions button {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0.2rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all var(--transition);
    }

    .post-item .actions button:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .post-item .actions .del:hover {
      border-color: #d4856e;
      color: #d4856e;
    }

    /* ===== 评论页 ===== */
    .giscus-wrapper {
      margin-top: 1rem;
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
      border: 1px solid var(--border-color);
      min-height: 400px;
    }

    .giscus-wrapper .giscus {
      max-width: 100%;
    }

    /* ===== 空状态 ===== */
    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    .empty .icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.5rem;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        padding: 1rem;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.8rem;
      }

      .sidebar-brand {
        font-size: 1.3rem;
        border-bottom: none;
        padding-bottom: 0;
        flex: 1;
      }

      .sidebar-nav {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 0.2rem;
        order: 3;
        width: 100%;
      }

      .sidebar-nav button {
        padding: 0.4rem 0.8rem;
        font-size: 0.85rem;
      }

      .sidebar-footer {
        margin-top: 0;
        border-top: none;
        padding-top: 0;
      }

      .main {
        padding: 1.2rem;
      }

      .post-controls {
        flex-direction: column;
      }

      .post-controls input,
      .post-controls textarea {
        flex-basis: auto;
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .sidebar-brand {
        font-size: 1.1rem;
      }

      .sidebar-nav button {
        font-size: 0.75rem;
        padding: 0.3rem 0.6rem;
      }

      .post-item {
        flex-direction: column;
        align-items: stretch;
      }

      .post-item .actions {
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>

  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar">
    <div class="sidebar-brand">NOESCAPE-Z</div>

    <nav class="sidebar-nav">
      <button class="active" data-page="home">🏠 首页</button>
      <button data-page="posts">📄 文章专区</button>
      <button data-page="comments">💬 评论</button>
    </nav>

    <div class="sidebar-footer">
      <button class="theme-toggle" id="themeToggle">🌓 切换主题</button>
    </div>
  </aside>

  <!-- ===== 主内容 ===== -->
  <main class="main">

    <!-- ===== 首页 ===== -->
    <section id="page-home" class="page active">
      <h2 style="margin-bottom: 1.2rem;">📌 更新动态</h2>
      <div class="update-list" id="updateList">
        <!-- 由 JavaScript 动态渲染 -->
      </div>
    </section>

    <!-- ===== 文章专区 ===== -->
    <section id="page-posts" class="page">
      <h2 style="margin-bottom: 1.2rem;">📝 文章专区</h2>

      <div class="post-controls">
        <input type="text" id="postTitle" placeholder="文章标题">
        <textarea id="postContent" placeholder="文章内容（支持 Markdown / HTML）"></textarea>
        <button class="btn" id="publishBtn">📤 发布文章</button>
      </div>

      <div class="post-list" id="postList">
        <!-- 由 JavaScript 动态渲染 -->
      </div>
    </section>

    <!-- ===== 评论 ===== -->
    <section id="page-comments" class="page">
      <h2 style="margin-bottom: 1.2rem;">💬 评论 · Giscus</h2>
      <div class="giscus-wrapper" id="giscusWrapper">
        <!-- Giscus 会自动挂载到这里 -->
        <div class="giscus"></div>
      </div>
    </section>

  </main>

  <!-- ============================================================ -->
  <!-- ===== JavaScript ===== -->
  <script>
    (function() {
      // ============================================================
      // 1. 数据层 (localStorage)
      // ============================================================
      const STORAGE_KEY = 'noescapez_blog_data';

      function getDefaultData() {
        return {
          updates: [
            { id: Date.now() - 3600000, text: '🎉 博客正式上线，欢迎来访！' },
            { id: Date.now() - 7200000, text: '📦 资源库更新：新增一批学习资料' },
          ],
          posts: [
            { id: Date.now() - 86400000, title: '📦 喂喂喂资源库更新啦！', content: '🎉 资源库又有新货了！<br>🔗 传送门：<a href="https://1838190346.share.123pan.cn/123pan/gfigTd-P1SLH?pwd=1145#" target="_blank">点击进入</a>', date: '2026-07-26' },
            { id: Date.now() - 172800000, title: '在算法洪流中，打捞一艘木帆船', content: '当全世界都在追逐效率与增长，我选择退回书桌一角，用最原始的方式——文字，来对抗遗忘。', date: '2026-07-25' },
          ]
        };
      }

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const data = JSON.parse(raw);
            if (data && typeof data === 'object') return data;
          }
        } catch (_) {}
        const def = getDefaultData();
        saveData(def);
        return def;
      }

      function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      // ============================================================
      // 2. 渲染函数
      // ============================================================

      // 渲染首页更新
      function renderUpdates() {
        const container = document.getElementById('updateList');
        const data = loadData();
        const updates = data.updates || [];

        if (!updates.length) {
          container.innerHTML = `<div class="empty"><span class="icon">📭</span> 暂无更新</div>`;
          return;
        }

        // 按时间倒序
        const sorted = [...updates].sort((a, b) => b.id - a.id);

        container.innerHTML = sorted.map(item => `
          <div class="update-item">
            <div class="time">${new Date(item.id).toLocaleString('zh-CN')}</div>
            <div class="content">${item.text}</div>
          </div>
        `).join('');
      }

      // 渲染文章列表
      function renderPosts() {
        const container = document.getElementById('postList');
        const data = loadData();
        const posts = data.posts || [];

        if (!posts.length) {
          container.innerHTML = `<div class="empty"><span class="icon">📝</span> 还没有文章，发布第一篇吧！</div>`;
          return;
        }

        const sorted = [...posts].sort((a, b) => b.id - a.id);

        container.innerHTML = sorted.map(post => `
          <div class="post-item" data-id="${post.id}">
            <div class="info">
              <div class="title">${post.title}</div>
              <div class="meta">${post.date || new Date(post.id).toLocaleDateString('zh-CN')}</div>
              <div style="margin-top:0.3rem;font-size:0.9rem;color:var(--text-secondary);">${post.content}</div>
            </div>
            <div class="actions">
              <button class="del" data-id="${post.id}">🗑️ 删除</button>
            </div>
          </div>
        `).join('');

        // 绑定删除事件
        container.querySelectorAll('.del').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = parseInt(this.dataset.id);
            if (confirm('确定要删除这篇文章吗？')) {
              const data = loadData();
              data.posts = data.posts.filter(p => p.id !== id);
              saveData(data);
              renderPosts();
              renderUpdates(); // 首页可能也有联动，刷新
            }
          });
        });
      }

      // ============================================================
      // 3. 发布文章
      // ============================================================
      function publishPost() {
        const titleEl = document.getElementById('postTitle');
        const contentEl = document.getElementById('postContent');
        const title = titleEl.value.trim();
        const content = contentEl.value.trim();

        if (!title) { alert('请输入文章标题'); return; }
        if (!content) { alert('请输入文章内容'); return; }

        const data = loadData();
        data.posts.push({
          id: Date.now(),
          title: title,
          content: content,
          date: new Date().toLocaleDateString('zh-CN'),
        });

        // 同时增加一条更新记录
        data.updates.push({
          id: Date.now(),
          text: `📄 发布了新文章：${title}`
        });

        saveData(data);

        // 清空输入
        titleEl.value = '';
        contentEl.value = '';

        // 刷新 UI
        renderPosts();
        renderUpdates();

        // 提示
        const toast = document.createElement('div');
        toast.style.cssText = `
          position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
          background: var(--bg-card); color: var(--text-primary);
          padding: 0.8rem 2rem; border-radius: 12px;
          border: 1px solid var(--accent);
          box-shadow: 0 4px 20px var(--shadow);
          z-index: 999; font-weight: 500;
          transition: opacity 0.3s;
        `;
        toast.textContent = '✅ 文章发布成功！';
        document.body.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2000);
      }

      // ============================================================
      // 4. 页面切换 (Tab)
      // ============================================================
      function switchPage(pageId) {
        // 隐藏所有 page
        document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
        // 显示目标
        const target = document.getElementById('page-' + pageId);
        if (target) target.classList.add('active');

        // 更新侧边栏按钮状态
        document.querySelectorAll('.sidebar-nav button').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.page === pageId);
        });

        // 如果切换到评论页，重新挂载 Giscus（可选）
        if (pageId === 'comments') {
          // Giscus 已经通过 script 自动加载，但需要确保容器存在
          // 可以用一个简单的方法：如果 .giscus 为空，重新触发加载
          const wrapper = document.querySelector('.giscus-wrapper .giscus');
          if (wrapper && !wrapper.hasChildNodes()) {
            // 触发重新加载：移除并重新添加 script？ 
            // 这里简单处理：Giscus 会自动检测并渲染，无需额外操作
          }
        }
      }

      // ============================================================
      // 5. 主题切换
      // ============================================================
      function toggleTheme() {
        const html = document.documentElement;
        const current = html.getAttribute('data-theme');
        const next = current === 'dark' ? '' : 'dark';
        if (next) {
          html.setAttribute('data-theme', 'dark');
        } else {
          html.removeAttribute('data-theme');
        }
        // 同步 Giscus 主题
        try {
          const iframe = document.querySelector('.giscus-frame');
          if (iframe && iframe.contentWindow) {
            const theme = next === 'dark' ? 'dark' : 'light';
            iframe.contentWindow.postMessage({
              giscus: { setConfig: { theme: theme } }
            }, 'https://giscus.app');
          }
        } catch (_) {}
      }

      // ============================================================
      // 6. 初始化
      // ============================================================
      function init() {
        // 加载数据
        const data = loadData();
        // 如果数据中没有 updates 或 posts，用默认值补充
        if (!data.updates) data.updates = getDefaultData().updates;
        if (!data.posts) data.posts = getDefaultData().posts;
        saveData(data);

        // 渲染
        renderUpdates();
        renderPosts();

        // 侧边栏导航
        document.querySelectorAll('.sidebar-nav button').forEach(btn => {
          btn.addEventListener('click', function() {
            switchPage(this.dataset.page);
          });
        });

        // 发布按钮
        document.getElementById('publishBtn').addEventListener('click', publishPost);

        // 主题切换
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);

        // 默认激活首页
        switchPage('home');
      }

      // 页面完全加载后执行
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>

</body>
</html>
